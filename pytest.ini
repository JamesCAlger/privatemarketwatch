[pytest]
testpaths = tests
markers =
    slow: tests that are expected to be too slow for the normal inner loop
    integration: tests that exercise multi-step pipeline orchestration or broad subsystem wiring
    staging_sql: tests that exercise DuckDB-backed staging SQL paths
    data_rebuild: tests or checks that rebuild cached pipeline artifacts
    use_real_promoted_stores: opt out of the per-test isolation of promoted agent-fix stores
    needs_cache: tests that require the local data/ cache (raw filings or built outputs); deselected in CI
