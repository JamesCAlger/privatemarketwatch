name: CI

on:
  push:
    branches: [main, ensemble-fp-experiment]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # cacheless full suite measured 1h46m locally (2026-09-02)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-ci.lock
      - name: Run cache-free test suite
        run: pytest tests/ -m "not needs_cache" -q --durations=20

  # warehouse/ (dbt + DuckDB). Tier 1: the parser and loader tests on committed fixtures, a check that
  # the dbt project parses, and a build on an invented fund (warehouse/ci/README.md): the filed layer,
  # the readings, the seeds and the row-role models with their tests and every unit test. The models
  # that read the pipeline's data/output are not built: that data is not in the repository.
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt
      - run: pip install -r requirements.txt
      - name: Parser and loader tests
        run: python -m pytest -q
      - name: dbt project parses
        run: dbt parse --profiles-dir . --no-version-check
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # Same command as locally. Writes only under the work folder; sets DBT_SEND_ANONYMOUS_USAGE_STATS
      # and passes --no-version-check itself.
      - name: Fixture build (parse, load readings, dbt build and unit tests)
        run: python ci/run_fixture_build.py --work "$RUNNER_TEMP/warehouse_ci"

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
