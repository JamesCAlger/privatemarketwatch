version: 2

seeds:
  - name: manager_brand
    description: Fund to manager brand. Generated from CIK_TO_MANAGER_BRAND in pipeline/config.py by scripts/make_manager_brand_seed.py. A brand, not the registered adviser.
    columns:
      - name: cik
        data_tests:
          - unique
          - not_null
      - name: manager_brand
        data_tests:
          - not_null
  - name: reading_action
    description: >
      The closed list of actions a reading rule may name, and the slice of the intermediate layer that builds each
      ('text' is the second spec). A rule naming an action not listed here fails the build. built_early_for_field: a
      field for which the action is already built before its slice (fraction_to_percent is built in slice 3 for
      pct_of_net_assets only, controller ruling slice 3 Task 3 fix round 1; for rates it stays slice 4). An action is
      built for a field when built_in_slice is 3, or built_early_for_field names that field, or (slice 4 Task 3)
      built_in_slice is 4 and the field is a rate field (macro rate_output_fields). printed_margin_cash_plus_pik is
      'text' since slice 5 Task 1 (it was 4): it is not built, it decides from the printed total margin, which the text
      spec reads (spec 6.4, action_field.unread_input). Its rows were and are text_not_read, decided in int_field_rule
      before any action is checked as built, so the label moved no row.
    config:
      column_types:
        built_in_slice: varchar
        built_early_for_field: varchar
    columns:
      - name: action
        data_tests:
          - unique
          - not_null
  - name: concept_map
    description: >
      The standard XBRL concepts, defined once (slice 3 Task 1). One row per (field, concept, namespace): a filed fact
      belongs to the field when its local name equals concept_local and its namespace matches namespace_pattern (a
      DuckDB glob), never on the prefix (filed_layer.md section 7 ruling 12). Every model that reads a standard concept
      reads it here; no model writes a concept name (pytests/test_no_concept_literals.py). A filer's own concept is a
      fund rule in its wrapper copy, not a row here. concept_map_id is the rule a standard value names (spec section 7).
      Two field columns (slice 4 Task 2): field is the term-fact family the row roles and the row-set check read
      (int_context_feature has_*, cmp_row_set rate facts); field rate holds both the interest-rate and the cash-pay
      concept, one definition of "a rate" (slice 3 ruling). read_field is the int_field_read field the concept is read
      into, which keeps the two rate tags apart (interest_rate_tag, interest_rate_cash_tag); empty for a concept
      int_field_read does not read (ownership percent).
    columns:
      - name: concept_map_id
        data_tests:
          - unique
          - not_null
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'shares', 'pct_of_net_assets', 'rate', 'spread',
                         'pik_rate', 'maturity', 'ownership_percent']
      - name: read_field
        description: The int_field_read field (one of its ten); empty where int_field_read does not read the concept.
        data_tests:
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'shares', 'pct_of_net_assets', 'interest_rate_tag',
                         'interest_rate_cash_tag', 'pik_rate', 'spread', 'maturity_date']
      - name: concept_local
        data_tests:
          - not_null
      - name: namespace_pattern
        data_tests:
          - not_null
  - name: role_pattern
    description: >
      The global part of the rule table for row roles (spec intermediate_spine.md 6.2): rules 4 and 5 (text) and the
      structural rule 7 axes. applies_to 'label_segment': a regular expression matched against each '|'-separated
      segment of an investment identifier label, lowercased, trimmed and with white space collapsed; role 'position'
      marks an exception that stops the cash-bucket pattern. applies_to 'axis': a regular expression matched against
      the lowercased local name of a context member's axis; for rule 7 the member names the scope, for rule 8 the axis
      may sit beside the cash and cash equivalents axis on a cash context. priority 10 ranks below every
      filer rule (20, 30). No fund name or label appears here.
    columns:
      - name: pattern_id
        data_tests:
          - unique
          - not_null
      - name: rule_number
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [4, 5, 7, 8]
                quote: false
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['label_segment', 'axis']
      - name: priority
        data_tests:
          - not_null
      - name: pattern
        data_tests:
          - not_null
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: ['aggregate', 'position']
  - name: field_rule_default
    description: >
      The global defaults of the amount and rate conversion (slice 3 Task 3, slice 4 Task 3; spec 5 and 6.4). One row per
      default rule: the field, the rows it applies to (applies_to, see int_field_rule), the action and priority 10,
      below every fund rule (20, 30). int_field_rule reads these as rules with origin global_default; nothing in SQL
      stands in for them. The action must be in seeds/reading_action.csv. No fund appears here.
    config:
      column_types:
        parameter: varchar
        priority: integer
    columns:
      - name: rule_id
        data_tests:
          - unique
          - not_null
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'principal_amount_usd', 'shares', 'pct_of_net_assets',
                         'pik_rate', 'spread', 'maturity_date']
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unit_usd', 'unit_foreign', 'unit_shares', 'unit_pure', 'principal_usd', 'date_read']
      - name: action
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reading_action')
                field: action
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10]
                quote: false
  - name: action_field
    description: >
      For each slice 3 and slice 4 action a fund rule may name, the amount or rate fields it governs and the rows it can act on
      (applies_to; the tests are in int_field_rule). A fund rule whose action is listed here takes part in the amount
      conversion. The action must be in seeds/reading_action.csv. No fund appears here. Slice 5 Task 4:
      adopt_adjacent_rate_context (applies_to rate_only_pair, built_in_slice 5) is the exception: it is decided in
      int_rate_adjacent, and int_field_rule never applies it (no branch of its applicable test reads rate_only_pair).
    columns:
      - name: action
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reading_action')
                field: action
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'principal_amount_usd', 'shares', 'pct_of_net_assets',
                         'interest_rate', 'spread']
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unit_foreign', 'unit_pure', 'two_unit_cost', 'two_unit_cost_principal_absent', 'shares_as_par',
                         'principal_as_units', 'sign_differs_from_print', 'principal_foreign', 'rate_tag',
                         'pik_tag_only', 'spread_with_pik', 'rate_only_pair']
      - name: unread_input
        description: >
          Empty, or the name of an input the action needs that no model reads yet (printed text, for example the printed
          total margin). A rule whose action names one cannot be decided on the rows it applies to: int_field_rule gives
          those rows resolution text_not_read, and int_field_normalised leaves the field unresolved with reason
          text_not_read, under a measured ceiling. Slice 4 Task 3 fix round 1 (controller ruling). A missing row feature
          stays feature_missing, an error class with ceiling 0. The values in use are listed (slice 4 Task 5): a new
          name, or a misspelt one, fails the build, so the list of inputs not yet read stays closed and reviewed.
          (int_field_rule treats any non-empty value as "needs an unread input"; only an empty cell switches the
          mechanism off for that action.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['printed_total_margin', 'printed_rate_type_and_loan_class']
  - name: unit_kind
    description: >
      Written unit text to unit kind (slice 5 Task 1; owner decision 10 of 2026-11-23 and slice 5 decision 6: the
      mapping is data, keyed by the unit as written, since the filed layer keeps the written unit and not the namespace
      behind a prefix). unit_pattern is an RE2 pattern matched against the whole unit text (numerator, or
      numerator/denominator); macro unit_kind returns the kind of the one row that matches, or other when none does.
      Kinds: usd, foreign, shares, pure, and other for a unit listed on purpose that no amount or rate field reads. A
      text matching two rows fails tests/unit_kind_one_row_per_unit.sql; a unit int_field_read reads for an amount or
      rate field that no row lists fails tests/unit_kind_read_units_listed.sql. A filer's own unit (a prefix of its
      own) is not listed here: no fund appears in a seed.
    columns:
      - name: unit_pattern
        data_tests:
          - unique
          - not_null
      - name: unit_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['usd', 'foreign', 'shares', 'pure', 'other']
  - name: correction_field
    description: >
      Slice 5 Task 2: each field a loaded correction sets (stg_correction.field), by store, mapped to this layer's
      field and to the step at which the correction acts (spec intermediate_spine.md section 11; slice 5 plan, terms).
      store_pattern is an RE2 pattern matched against the whole store name; one correction matches exactly one row
      (tests/readings_correction_field_mapped.sql), so a new field or store fails the build until a row is added. The
      store is part of the key because the step differs by store: a wrapper untagged value is filed (production fills
      it at parse time, conversion runs on it); the same field in a row store is converted (production replaces the
      published value). Steps: filed, converted, reading_input (an input of the rate reading, which re-runs),
      companion (travels with the field in companion_of; layer_field is then a column of that field's row: currency,
      fx_rate), deferred (this layer does not hold the field; the correction waits for the text spec, slice 5
      decision 3). layer_field: the int_field_normalised field, or the column for a companion and for rate_kind; empty
      when the layer holds nothing. note: where production applies it.
    columns:
      - name: correction_field
        data_tests: [not_null]
      - name: store_pattern
        data_tests: [not_null]
      - name: step
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['filed', 'converted', 'reading_input', 'companion', 'deferred']
      - name: companion_of
        data_tests:
          - not_null:
              config:
                where: "step = 'companion'"
      - name: layer_field
        data_tests:
          - not_null:
              config:
                where: "step in ('filed', 'converted', 'reading_input')"
  - name: sofr_90day_avg
    description: >
      Text slice R phase 1 (2026-11-26): the SOFR 90-day average in percent, one row per published date. Read by the
      measurement int_text_measure_sofr_level and by the sanity bound of int_text_check_base_cluster_group. A copy, not a
      download: source data/reference/sofr_90day_avg.csv (the file pipeline/sofr_reference.py reads; FRED SOFR90DAYAVG
      cached by scripts/fetch_sofr.py), copied at git acbccdfa. sha256 of the bytes as committed (LF line ends), the same
      for source and seed: 1fc3e109da22cd8ebea9b74ed84d9be34dc237781892364d98da5711ee0bde45, recorded in var
      sofr_seed_sha256 and checked by tests/seed_sofr_hash_matches.sql; the seed is -text in .gitattributes (fix round 1),
      so every checkout has those bytes. 1,988 dates, 2018-07-02 to 2026-06-18. A backward-looking average, a proxy for
      the term SOFR loans reference (pipeline/sofr_reference.py: expect a 0.10 to 0.20 point gap).
    config:
      column_types:
        date: date
        sofr_90day_avg_pct: double
    columns:
      - name: date
        data_tests: [unique, not_null]
      - name: sofr_90day_avg_pct
        data_tests: [not_null]
  - name: base_rate_fred
    description: >
      Text slice R phase 2 (2026-11-26): public base-rate series downloaded from FRED on 2026-11-26 with the owner's go
      by scripts/text/fetch_base_rates.py (manifest scripts/text/base_rate_fred_manifest.json: per series the URL, rows,
      first and last date and the sha256 of the bytes received). One row per (series_id, date), value in percent,
      from 2021-06-01. Daily: SOFR and its 30/90/180-day averages, SONIA (IUDSOIA), the prime rate (DPRIME), the
      effective fed funds rate (DFF). Monthly OECD 3-month interbank rates (dated the first of the month, a monthly
      average): proxies for USD LIBOR, EURIBOR, the UK, CORRA/CDOR, BBSW/BBSY, BKBM, STIBOR, SARON, NIBOR, TONA and
      KORIBOR. The euro area and UK monthly series end 2026-01. Term SOFR and LIBOR are licensed and are not here.
      sha256 of the file as committed (LF) recorded in var base_rate_fred_sha256 and checked by
      tests/seed_base_rate_hash_matches.sql; the file is -text in .gitattributes. Read by int_text_base_rate_window.
    config:
      column_types:
        series_id: varchar
        date: date
        value_pct: double
    columns:
      - name: series_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('base_rate_series')
                field: series_id
      - name: date
        data_tests: [not_null]
      - name: value_pct
        data_tests: [not_null]
  - name: base_rate_series
    description: >
      Text slice R phase 2 (2026-11-26): one row per FRED series of seed base_rate_fred (written by the same script).
      rate_name: the name the rate proposals use (SOFR, SONIA, PRIME, FEDFUNDS, LIBOR, EURIBOR, CORRA, BBSW, BKBM,
      STIBOR, SARON, NIBOR, TONA, KORIBOR). kind: published (the rate itself, daily), average (a backward average of
      the rate), proxy (an OECD monthly 3-month interbank average standing for the benchmark, not the benchmark). A
      rate can have two series (SONIA: published daily and a UK monthly proxy); int_text_base_rate_window says which
      it uses. sha256 recorded in var base_rate_series_sha256 (tests/seed_base_rate_hash_matches.sql).
    config:
      column_types:
        series_id: varchar
        rate_name: varchar
        frequency: varchar
        kind: varchar
        note: varchar
    columns:
      - name: series_id
        data_tests: [unique, not_null]
      - name: rate_name
        data_tests: [not_null]
      - name: frequency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['daily', 'monthly']
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['published', 'average', 'proxy']
  - name: reference_rate
    description: >
      Text slice R phase 3 (2026-11-26, owner addition B): one row per benchmark a rate code can mean. rate_name: the
      canonical name every rate-text rule (wrapper action rate_code) must resolve to (tests/reference_rate_rule_resolves.sql).
      currency; kind: overnight, term, interbank, prime or base ("Base Rate" and "CAD Base Rate": a loan's base rate as
      printed, no single benchmark, no series). successor: the rate that replaced it (LIBOR -> SOFR, CDOR -> CORRA); BBSW
      and BBSY stay two rates with no link. series_id: the FRED series of seed base_rate_series the base-level checks
      read for it, blank where none (CDOR and BBSY read the OECD proxy their pair shares). Owner item 1: a printed code
      equal to a rate_name here (case and spaces ignored) is that rate. Rate names are looked up here and in seed
      reference_rate_name, never matched by substring.
    config:
      column_types:
        rate_name: varchar
        currency: varchar
        kind: varchar
        successor: varchar
        series_id: varchar
        note: varchar
    columns:
      - name: rate_name
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['overnight', 'term', 'interbank', 'prime', 'base']
      - name: successor
        data_tests:
          - relationships:
              arguments:
                to: ref('reference_rate')
                field: rate_name
      - name: series_id
        data_tests:
          - relationships:
              arguments:
                to: ref('base_rate_series')
                field: series_id
  - name: reference_rate_name
    description: >
      Text slice R phase 3 (2026-11-26): the printed names and abbreviations of rates in the five funds' legends that
      are not themselves a rate_name of seed reference_rate, and the rate each stands for (upper case, as printed:
      'SECURED OVERNIGHT FINANCING RATE' -> SOFR, 'TONAR' -> TONA). Exact lookup, no substring. Built from
      scripts/text/q_t3_legend_names.sql; a legend name not listed resolves to no rate.
    config:
      column_types:
        printed_name: varchar
        rate_name: varchar
        note: varchar
    columns:
      - name: printed_name
        data_tests: [unique, not_null]
      - name: rate_name
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reference_rate')
                field: rate_name
  - name: text_rate_unread_cap
    description: >
      Text slice R phase 3 fix round 1 (2026-11-26): for each group (column unit, shape, status) of printed rate cells
      the accepted rules leave unread, the positions measured on 2026-11-26 (scripts/text/q_t3_unread_cap.sql writes
      the rows). tests/int_text_rate_unread_within_cap.sql fails a group that grows or is new. unit_key names no fund.
    config:
      column_types:
        unit_key: varchar
        shape: varchar
        status: varchar
        max_positions: integer
    columns:
      - name: max_positions
        data_tests: [not_null]
  - name: text_proposed_column
    description: >
      Text slice R phase 2 (2026-11-26). PROPOSALS, NOT RULES: nothing downstream may publish from this seed, and no
      model may feed it into a field, a wrapper or a mart. What an agent (claude-sonnet-5-5, run of record
      text_runs/2026-11-26_rates_run3) proposed each rate-candidate column holds, asked twice with the answer options
      in forward and reversed order. Written by scripts/text/proposals_to_seeds.py from the run folder (deterministic;
      rerun it to regenerate). One row per (run_id, unit_key); unit_key is the column unit of int_text_column_unit.
      same_in_both_orders: both orders gave the same answer. Judged by int_text_proposal_verdict, a measurement the
      owner reads.
    config:
      column_types:
        run_id: varchar
        unit_key: varchar
        column_holds_fwd: varchar
        column_holds_rev: varchar
        same_in_both_orders: boolean
    columns:
      - name: unit_key
        data_tests: [unique, not_null]
      - name: run_id
        data_tests: [not_null]
      - name: same_in_both_orders
        data_tests: [not_null]
  - name: text_proposed_shape_role
    description: >
      Text slice R phase 2 (2026-11-26). PROPOSALS, NOT RULES: nothing downstream may publish from this seed. The role
      an agent proposed for the k-th number (number_index, 1-based) of each text shape of each rate-candidate column, in
      forward and reversed option order (same run and script as text_proposed_column). A shape with no number gets one
      row with number_index 0 and empty roles. same_in_both_orders: the two roles are equal and the two role lists have
      the same length (lists of different length make every row of the shape not same; a shape answered in one order
      only is not same). roles_fit_shape: both lists hold as many roles as the shape has '#'. Roles: spread_bps,
      spread_pct, floor_pct, all_in_rate_pct, cash_rate_pct, pik_rate_pct, pik_spread_pct, fixed_rate_pct,
      pct_of_net_assets, other_number, cannot_tell (scripts/text/propose_rules.py NUMBER_ROLES). shape is the display
      shape of the bundle; int_text_rate_proposed matches it upper-cased to int_text_cell.shape_key_text.
      Key: (run_id, unit_key, shape, number_index), tests/int_text_proposal_keys_unique.sql.
    config:
      column_types:
        run_id: varchar
        unit_key: varchar
        shape: varchar
        number_index: integer
        role_fwd: varchar
        role_rev: varchar
        same_in_both_orders: boolean
        roles_fit_shape: boolean
    columns:
      - name: unit_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('text_proposed_column')
                field: unit_key
      - name: shape
        data_tests: [not_null]
      - name: number_index
        data_tests: [not_null]
      - name: role_fwd
        data_tests:
          - accepted_values:
              arguments:
                values: ['spread_bps', 'spread_pct', 'floor_pct', 'all_in_rate_pct', 'cash_rate_pct', 'pik_rate_pct',
                         'pik_spread_pct', 'fixed_rate_pct', 'pct_of_net_assets', 'other_number', 'cannot_tell']
      - name: role_rev
        data_tests:
          - accepted_values:
              arguments:
                values: ['spread_bps', 'spread_pct', 'floor_pct', 'all_in_rate_pct', 'cash_rate_pct', 'pik_rate_pct',
                         'pik_spread_pct', 'fixed_rate_pct', 'pct_of_net_assets', 'other_number', 'cannot_tell']
  - name: text_proposed_code
    description: >
      Text slice R phase 2 (2026-11-26). PROPOSALS, NOT RULES: nothing downstream may publish from this seed. The
      reference rate an agent proposed each code printed in a rate-candidate column stands for, in forward and
      reversed option order (same run and script as text_proposed_column). rate_name_fwd/_rev: the answer normalised to
      the rate_name vocabulary of seed base_rate_series (SOFR, EURIBOR, SONIA, LIBOR, PRIME, CORRA, BBSW, BKBM, STIBOR,
      SARON, NIBOR, TONA, KORIBOR, FEDFUNDS) plus CDOR and BBSY, empty where it maps to none (CIBOR, SORA, the Bloomberg
      short-term bank yield index, Canadian prime, not_a_code). Fix round 1: CDOR, CORRA, BBSY and BBSW are four names
      here and everywhere downstream; only int_text_check_base_level reads CDOR against the CORRA proxy series and BBSY
      against the BBSW one (rate_name_note says so). rate_name: the agreed normalised name when both orders give the
      same, else empty. same_in_both_orders: normalised names equal (two answers that map to no name are compared as
      upper-cased text, or by the rule that matched them). basis: legend, common_usage, cannot_tell or not_a_code, per
      order. Key: (run_id, unit_key, code), tests/int_text_proposal_keys_unique.sql.
    config:
      column_types:
        run_id: varchar
        unit_key: varchar
        code: varchar
        reference_rate_fwd: varchar
        reference_rate_rev: varchar
        rate_name_fwd: varchar
        rate_name_rev: varchar
        rate_name: varchar
        rate_name_note: varchar
        basis_fwd: varchar
        basis_rev: varchar
        same_in_both_orders: boolean
    columns:
      - name: unit_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('text_proposed_column')
                field: unit_key
      - name: code
        data_tests: [not_null]
      - name: rate_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['SOFR', 'EURIBOR', 'SONIA', 'LIBOR', 'PRIME', 'CORRA', 'BBSW', 'BKBM', 'STIBOR', 'SARON',
                         'NIBOR', 'TONA', 'KORIBOR', 'FEDFUNDS', 'CDOR', 'BBSY']
