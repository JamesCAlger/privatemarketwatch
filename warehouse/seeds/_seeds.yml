version: 2

seeds:
  - name: manager_brand
    description: Fund to manager brand. Generated from CIK_TO_MANAGER_BRAND in pipeline/config.py by scripts/make_manager_brand_seed.py. A brand, not the registered adviser.
    columns:
      - name: cik
        data_tests:
          - unique
          - not_null
      - name: manager_brand
        data_tests:
          - not_null
  - name: reading_action
    description: >
      The closed list of actions a reading rule may name, and the slice of the intermediate layer that builds each
      ('text' is the second spec). A rule naming an action not listed here fails the build. built_early_for_field: a
      field for which the action is already built before its slice (fraction_to_percent is built in slice 3 for
      pct_of_net_assets only, controller ruling slice 3 Task 3 fix round 1; for rates it stays slice 4). An action is
      built for a field when built_in_slice is 3, or built_early_for_field names that field, or (slice 4 Task 3)
      built_in_slice is 4 and the field is a rate field (macro rate_output_fields). printed_margin_cash_plus_pik is
      'text' since slice 5 Task 1 (it was 4): it is not built, it decides from the printed total margin, which the text
      spec reads (spec 6.4, action_field.unread_input). Its rows were and are text_not_read, decided in int_field_rule
      before any action is checked as built, so the label moved no row.
    config:
      column_types:
        built_in_slice: varchar
        built_early_for_field: varchar
    columns:
      - name: action
        data_tests:
          - unique
          - not_null
  - name: concept_map
    description: >
      The standard XBRL concepts, defined once (slice 3 Task 1). One row per (field, concept, namespace): a filed fact
      belongs to the field when its local name equals concept_local and its namespace matches namespace_pattern (a
      DuckDB glob), never on the prefix (filed_layer.md section 7 ruling 12). Every model that reads a standard concept
      reads it here; no model writes a concept name (pytests/test_no_concept_literals.py). A filer's own concept is a
      fund rule in its wrapper copy, not a row here. concept_map_id is the rule a standard value names (spec section 7).
      Two field columns (slice 4 Task 2): field is the term-fact family the row roles and the row-set check read
      (int_context_feature has_*, cmp_row_set rate facts); field rate holds both the interest-rate and the cash-pay
      concept, one definition of "a rate" (slice 3 ruling). read_field is the int_field_read field the concept is read
      into, which keeps the two rate tags apart (interest_rate_tag, interest_rate_cash_tag); empty for a concept
      int_field_read does not read (ownership percent).
    columns:
      - name: concept_map_id
        data_tests:
          - unique
          - not_null
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'shares', 'pct_of_net_assets', 'rate', 'spread',
                         'pik_rate', 'maturity', 'ownership_percent']
      - name: read_field
        description: The int_field_read field (one of its ten); empty where int_field_read does not read the concept.
        data_tests:
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'shares', 'pct_of_net_assets', 'interest_rate_tag',
                         'interest_rate_cash_tag', 'pik_rate', 'spread', 'maturity_date']
      - name: concept_local
        data_tests:
          - not_null
      - name: namespace_pattern
        data_tests:
          - not_null
  - name: role_pattern
    description: >
      The global part of the rule table for row roles (spec intermediate_spine.md 6.2): rules 4 and 5 (text) and the
      structural rule 7 axes. applies_to 'label_segment': a regular expression matched against each '|'-separated
      segment of an investment identifier label, lowercased, trimmed and with white space collapsed; role 'position'
      marks an exception that stops the cash-bucket pattern. applies_to 'axis': a regular expression matched against
      the lowercased local name of a context member's axis; for rule 7 the member names the scope, for rule 8 the axis
      may sit beside the cash and cash equivalents axis on a cash context. priority 10 ranks below every
      filer rule (20, 30). No fund name or label appears here.
    columns:
      - name: pattern_id
        data_tests:
          - unique
          - not_null
      - name: rule_number
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [4, 5, 7, 8]
                quote: false
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['label_segment', 'axis']
      - name: priority
        data_tests:
          - not_null
      - name: pattern
        data_tests:
          - not_null
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: ['aggregate', 'position']
  - name: field_rule_default
    description: >
      The global defaults of the amount and rate conversion (slice 3 Task 3, slice 4 Task 3; spec 5 and 6.4). One row per
      default rule: the field, the rows it applies to (applies_to, see int_field_rule), the action and priority 10,
      below every fund rule (20, 30). int_field_rule reads these as rules with origin global_default; nothing in SQL
      stands in for them. The action must be in seeds/reading_action.csv. No fund appears here.
    config:
      column_types:
        parameter: varchar
        priority: integer
    columns:
      - name: rule_id
        data_tests:
          - unique
          - not_null
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'principal_amount_usd', 'shares', 'pct_of_net_assets',
                         'pik_rate', 'spread', 'maturity_date']
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unit_usd', 'unit_foreign', 'unit_shares', 'unit_pure', 'principal_usd', 'date_read']
      - name: action
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reading_action')
                field: action
      - name: priority
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [10]
                quote: false
  - name: action_field
    description: >
      For each slice 3 and slice 4 action a fund rule may name, the amount or rate fields it governs and the rows it can act on
      (applies_to; the tests are in int_field_rule). A fund rule whose action is listed here takes part in the amount
      conversion. The action must be in seeds/reading_action.csv. No fund appears here.
    columns:
      - name: action
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reading_action')
                field: action
      - name: field
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'cost', 'principal_amount', 'principal_amount_usd', 'shares', 'pct_of_net_assets',
                         'interest_rate', 'spread']
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['unit_foreign', 'unit_pure', 'two_unit_cost', 'two_unit_cost_principal_absent', 'shares_as_par',
                         'principal_as_units', 'sign_differs_from_print', 'principal_foreign', 'rate_tag',
                         'pik_tag_only', 'spread_with_pik']
      - name: unread_input
        description: >
          Empty, or the name of an input the action needs that no model reads yet (printed text, for example the printed
          total margin). A rule whose action names one cannot be decided on the rows it applies to: int_field_rule gives
          those rows resolution text_not_read, and int_field_normalised leaves the field unresolved with reason
          text_not_read, under a measured ceiling. Slice 4 Task 3 fix round 1 (controller ruling). A missing row feature
          stays feature_missing, an error class with ceiling 0. The values in use are listed (slice 4 Task 5): a new
          name, or a misspelt one, fails the build, so the list of inputs not yet read stays closed and reviewed.
          (int_field_rule treats any non-empty value as "needs an unread input"; only an empty cell switches the
          mechanism off for that action.)
        data_tests:
          - accepted_values:
              arguments:
                values: ['printed_total_margin', 'printed_rate_type_and_loan_class']
  - name: unit_kind
    description: >
      Written unit text to unit kind (slice 5 Task 1; owner decision 10 of 2026-11-23 and slice 5 decision 6: the
      mapping is data, keyed by the unit as written, since the filed layer keeps the written unit and not the namespace
      behind a prefix). unit_pattern is an RE2 pattern matched against the whole unit text (numerator, or
      numerator/denominator); macro unit_kind returns the kind of the one row that matches, or other when none does.
      Kinds: usd, foreign, shares, pure, and other for a unit listed on purpose that no amount or rate field reads. A
      text matching two rows fails tests/unit_kind_one_row_per_unit.sql; a unit int_field_read reads for an amount or
      rate field that no row lists fails tests/unit_kind_read_units_listed.sql. A filer's own unit (a prefix of its
      own) is not listed here: no fund appears in a seed.
    columns:
      - name: unit_pattern
        data_tests:
          - unique
          - not_null
      - name: unit_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['usd', 'foreign', 'shares', 'pure', 'other']
  - name: correction_field
    description: >
      Slice 5 Task 2: each field a loaded correction sets (stg_correction.field), by store, mapped to this layer's
      field and to the step at which the correction acts (spec intermediate_spine.md section 11; slice 5 plan, terms).
      store_pattern is an RE2 pattern matched against the whole store name; one correction matches exactly one row
      (tests/readings_correction_field_mapped.sql), so a new field or store fails the build until a row is added. The
      store is part of the key because the step differs by store: a wrapper untagged value is filed (production fills
      it at parse time, conversion runs on it); the same field in a row store is converted (production replaces the
      published value). Steps: filed, converted, reading_input (an input of the rate reading, which re-runs),
      companion (travels with the field in companion_of; layer_field is then a column of that field's row: currency,
      fx_rate), deferred (this layer does not hold the field; the correction waits for the text spec, slice 5
      decision 3). layer_field: the int_field_normalised field, or the column for a companion and for rate_kind; empty
      when the layer holds nothing. note: where production applies it.
    columns:
      - name: correction_field
        data_tests: [not_null]
      - name: store_pattern
        data_tests: [not_null]
      - name: step
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['filed', 'converted', 'reading_input', 'companion', 'deferred']
      - name: companion_of
        data_tests:
          - not_null:
              config:
                where: "step = 'companion'"
      - name: layer_field
        data_tests:
          - not_null:
              config:
                where: "step in ('filed', 'converted', 'reading_input')"
