version: 2

seeds:
  - name: manager_brand
    description: Fund to manager brand. Generated from CIK_TO_MANAGER_BRAND in pipeline/config.py by scripts/make_manager_brand_seed.py. A brand, not the registered adviser.
    columns:
      - name: cik
        data_tests:
          - unique
          - not_null
      - name: manager_brand
        data_tests:
          - not_null
  - name: reading_action
    description: The closed list of actions a reading rule may name, and the slice of the intermediate layer that builds each ('text' is the second spec). A rule naming an action not listed here fails the build.
    columns:
      - name: action
        data_tests:
          - unique
          - not_null
  - name: role_pattern
    description: >
      The global part of the rule table for row roles (spec intermediate_spine.md 6.2): rules 4 and 5 (text) and the
      structural rule 7 axes. applies_to 'label_segment': a regular expression matched against each '|'-separated
      segment of an investment identifier label, lowercased, trimmed and with white space collapsed; role 'position'
      marks an exception that stops the cash-bucket pattern. applies_to 'axis': a regular expression matched against
      the lowercased local name of a context member's axis; for rule 7 the member names the scope, for rule 8 the axis
      may sit beside the cash and cash equivalents axis on a cash context. priority 10 ranks below every
      filer rule (20, 30). No fund name or label appears here.
    columns:
      - name: pattern_id
        data_tests:
          - unique
          - not_null
      - name: rule_number
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [4, 5, 7, 8]
                quote: false
      - name: applies_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['label_segment', 'axis']
      - name: priority
        data_tests:
          - not_null
      - name: pattern
        data_tests:
          - not_null
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: ['aggregate', 'position']
  - name: filer_concept
    description: >
      Filer rules held as data (controller ruling, fix round 3): a concept a filer files in its own namespace instead
      of the us-gaap one, and what it stands for. Matched on the filer's cik plus the exact namespace and local name
      (filed_layer ruling 12: never on the local name alone). One row per namespace actually filed, found by query
      (warehouse/scripts/slice2/q_filer_concept_seed.sql). maps_to fair_value: read as the fair value where a context
      has no us-gaap fair-value fact. maps_to term_fact: counts toward has_term_fact. Each row must match a filed fact
      (tests/filer_concept_occurs_in_filed_layer.sql).
    columns:
      - name: filer_concept_id
        data_tests:
          - unique
          - not_null
      - name: cik
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_v05_scope')
                field: cik
      - name: concept_namespace
        data_tests:
          - not_null
      - name: concept_local
        data_tests:
          - not_null
      - name: maps_to
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fair_value', 'term_fact']
      - name: evidence
        data_tests:
          - not_null
