          - {accession: A, context_id: p5, cik: "1", report_date: 2026-06-30, constraint_name: c5_base_level, verdict: fail, rule_ids: [rc2]}
    expect:
      rows:
        - {cik: "1", constraint_name: A1_spread_needs_reference_rate, rule_key: k_spread, positions: 2}
