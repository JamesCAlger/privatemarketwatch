          - {accession: A, context_id: p2, cik: "1", report_date: 2026-06-30, field: spread, constraint_name: A1_spread_needs_reference_rate, rule_id: ra2, value: 5.0, cell_text: "5.00%"}
          - {accession: A, context_id: p3, cik: "1", report_date: 2026-06-30, field: floor, constraint_name: A2_floor_needs_reference_rate, rule_id: rb, value: 1.0, cell_text: "1.00% Floor"}
