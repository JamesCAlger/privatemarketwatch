  - name: int_text_rate_constraint_real_errors_fail
    description: >
      Owner addition A4 and A5, a real error still fails each. p1 all-in 9.00, cash 6.00, PIK 2.00 -> c4 fail; p2 9.00 =
      7.00 + 2.00 -> c4 pass. p3 SOFR, spread 5.00, all-in 9.50 at 2026-03-31 with SOFR's window 3.60 to 4.20 (admissible
      3.30 to 4.76): implied base 4.50 -> c5 pass; p4 all-in 12.00: implied 7.00 -> c5 fail; p5 a rate with no series
      (Base Rate) -> not_tested; p6 the all-in TAG equals the spread (5.00): not_tested (the tag holds another leg).
      Fix round 2: p7 all-in 6.00, PIK 8.00, no cash rate read: the implied cash leg is negative -> c4 fail; p8 a
      whole-coupon reading (all-in 10.00 = PIK 10.00) -> c4 pass.
    model: int_text_rate_constraint
    given:
      - input: ref('int_text_rate_read')
        rows:
          - {accession: A, context_id: p1, cik: "1", report_date: 2026-03-31, all_in_rate: 9.0, cash_rate: 6.0, pik_rate: 2.0}
          - {accession: A, context_id: p2, cik: "1", report_date: 2026-03-31, all_in_rate: 9.0, cash_rate: 7.0, pik_rate: 2.0}
          - {accession: A, context_id: p3, cik: "1", report_date: 2026-03-31, reference_rate: SOFR, spread: 5.0, all_in_rate: 9.5}
          - {accession: A, context_id: p4, cik: "1", report_date: 2026-03-31, reference_rate: SOFR, spread: 5.0, all_in_rate: 12.0}
          - {accession: A, context_id: p5, cik: "1", report_date: 2026-03-31, reference_rate: "Base Rate", spread: 1.0, all_in_rate: 8.5}
          - {accession: A, context_id: p6, cik: "1", report_date: 2026-03-31, reference_rate: SOFR, spread: 5.0, all_in_rate_tag: 5.0}
          - {accession: A, context_id: p7, cik: "1", report_date: 2026-03-31, all_in_rate: 6.0, pik_rate: 8.0, all_in_source: all_in}
          - {accession: A, context_id: p8, cik: "1", report_date: 2026-03-31, all_in_rate: 10.0, pik_rate: 10.0, all_in_source: pik_coupon}
      - input: ref('int_field_normalised')
        format: sql
        rows: |
          select 'A' as accession, 'none' as context_id, 'pik_rate' as field, 'normalised' as status, 0.0 as value
          where false
      - input: ref('reference_rate')
        rows:
          - {rate_name: SOFR, series_id: SOFR}
          - {rate_name: "Base Rate", series_id: null}
      - input: ref('base_rate_series')
        rows:
          - {series_id: SOFR, rate_name: SOFR}
      - input: ref('int_text_base_rate_window')
        rows:
          - {report_date: 2026-03-31, rate_name: SOFR, range_min: 3.6, range_max: 4.2, admissible_low: 3.3, admissible_high: 4.76, state: ok}
    expect:
      rows:
        - {context_id: p1, constraint_name: c4_legs, verdict: fail}
        - {context_id: p2, constraint_name: c4_legs, verdict: pass}
        - {context_id: p3, constraint_name: c5_base_level, verdict: pass}
        - {context_id: p4, constraint_name: c5_base_level, verdict: fail}
        - {context_id: p5, constraint_name: c5_base_level, verdict: not_tested}
        - {context_id: p6, constraint_name: c5_base_level, verdict: not_tested}
        - {context_id: p7, constraint_name: c4_legs, verdict: fail}
        - {context_id: p8, constraint_name: c4_legs, verdict: pass}

  - name: int_text_rate_finding_stable_id
    description: >
      Fix round 2. Two rate_role rules ra1 and ra2 read the same column, shape, number and role and differ only in their
      evidence text and counts (so their rule_ids differ): their held values make ONE finding (one id, 2 positions). Two
      rate_code rules for code S = SOFR that differ only in their filing dates (rc1, rc2) make one finding of constraint
      5. A rule with another role (rb) is a separate finding.
    model: int_text_rate_finding
    given:
      - input: ref('int_text_rate_rule')
        rows:
          - {rule_id: ra1, rule_key: k_spread, cik: "1", action: rate_role, evidence: "check number_tag: 10 of 10"}
          - {rule_id: ra2, rule_key: k_spread, cik: "1", action: rate_role, evidence: "check number_tag: 12 of 12, new wording"}
          - {rule_id: rb, rule_key: k_floor, cik: "1", action: rate_role, evidence: "owner item 5"}
          - {rule_id: rc1, rule_key: k_code_s, cik: "1", action: rate_code, first_filing_date: 2025-03-31, last_filing_date: 2025-12-31}
          - {rule_id: rc2, rule_key: k_code_s, cik: "1", action: rate_code, first_filing_date: 2025-03-31, last_filing_date: 2026-06-30}
      - input: ref('int_text_rate_held')
        rows:
