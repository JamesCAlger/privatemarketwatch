  - name: int_rate_scale_rules_and_print
    description: >
      Owner ruling B, 2026-11-23. Fund 1. Filing A has two scale rules: 'interest_rate_tag percent' and 'spread
      basis_points'. k1 a rate tag 13.0 in utr:Rate printed '13.00%' -> kept_as_percent. k2 a spread 4.5 printed 'S+450,
      0.75% Floor' -> kept_as_percent (basis points). k3 a rate tag 6.1 printed 'S+610' under the percent rule -> NOT kept
      (printed_disagrees: 610 is not 6.1 and no percent sign follows). k4 a rate tag 7.0 printed '7.00' with no percent
      sign in its cell or the next -> NOT kept. k5 a PIK rate 6.5 in filing A, no PIK rule -> no_scale_rule. k6 a rate
      0.095 (not above 1) -> no row. Filing C: a rule 'interest_rate_tag basis_points' (refused by
      tests/rate_scale_rule_selectors.sql) on k7 printed 'S+500' -> NOT kept: basis points only count on a spread.
