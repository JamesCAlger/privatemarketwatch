  - name: int_rate_scale_rules_and_print
    description: >
      Owner ruling B, 2026-11-23. Fund 1. Filing A has two scale rules: 'interest_rate_tag percent' and 'spread
      basis_points'. k1 a rate tag 13.0 in utr:Rate printed '13.00%' -> kept_as_percent. k2 a spread 4.5 printed 'S+450,
      0.75% Floor' -> kept_as_percent (basis points). k3 a rate tag 6.1 printed 'S+610' under the percent rule -> NOT kept
      (printed_disagrees: 610 is not 6.1 and no percent sign follows). k4 a rate tag 7.0 printed '7.00' with no percent
      sign in its cell or the next -> NOT kept. k5 a PIK rate 6.5 in filing A, no PIK rule -> no_scale_rule. k6 a rate
      0.095 (not above 1) -> no row. Filing C: a rule 'interest_rate_tag basis_points' (refused by
      tests/rate_scale_rule_selectors.sql) on k7 printed 'S+500' -> NOT kept: basis points only count on a spread.
    model: int_rate_scale
    given:
      - input: ref('unit_kind')
        rows:
          - {unit_pattern: "iso4217:USD", unit_kind: usd}
          - {unit_pattern: "iso4217:([A-TV-Z][A-Z]{2}|U[A-RT-Z][A-Z]|US[A-CE-Z])", unit_kind: foreign}
          - {unit_pattern: shares, unit_kind: shares}
          - {unit_pattern: pure, unit_kind: pure}
          - {unit_pattern: "utr:Rate", unit_kind: pure}
      - input: ref('int_field_read')
        format: sql
        rows: |
          select acc as accession, ctx as context_id, field, '1' as cik, date '2026-03-31' as report_date,
                 'read' as status, false as is_nil, value_filed, unit, printed_text, fact_id
          from (values
            ('A', 'k1', 'interest_rate_tag', 13.0, 'utr:Rate', '13.00', 'f1'),
            ('A', 'k2', 'spread', 4.5, 'pure', '450', 'f2'),
            ('A', 'k3', 'interest_rate_tag', 6.1, 'pure', '610', 'f3'),
            ('A', 'k4', 'interest_rate_tag', 7.0, 'pure', '7.00', 'f4'),
            ('A', 'k5', 'pik_rate', 6.5, 'pure', '6.50', 'f5'),
            ('A', 'k6', 'interest_rate_tag', 0.095, 'pure', '9.50', 'f6'),
            ('C', 'k7', 'interest_rate_tag', 5.0, 'pure', '500', 'f7')
          ) t(acc, ctx, field, value_filed, unit, printed_text, fact_id)
      - input: ref('stg_reading_rule')
        rows:
          - {rule_id: ra, cik: "1", sel_accession: A, action: ratio_value_is_percent, parameter: "interest_rate_tag percent"}
          - {rule_id: rb, cik: "1", sel_accession: A, action: ratio_value_is_percent, parameter: "spread basis_points"}
          - {rule_id: rc, cik: "1", sel_accession: C, action: ratio_value_is_percent, parameter: "interest_rate_tag basis_points"}
          - {rule_id: rx, cik: "1", sel_accession: A, action: rate_is_all_in, parameter: null}
      - input: ref('stg_filed_fact_placement')
        format: sql
        rows: |
          select acc as accession, fid as fact_id, ri as row_index, 0 as cell_index, null::integer as shown_row_index,
                 null::integer as shown_cell_index
          from (values ('A', 'f1', 1), ('A', 'f2', 2), ('A', 'f3', 3), ('A', 'f4', 4), ('A', 'f5', 5), ('A', 'f6', 6),
                       ('C', 'f7', 7)) t(acc, fid, ri)
      - input: ref('stg_filed_document_row')
        format: sql
        rows: |
