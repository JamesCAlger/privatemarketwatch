          - {accession: C, context_id: n2, identifier_label: "Alpha Co | Class A Units", has_rate: true, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: C, context_id: n3, identifier_label: "Gamma Co | Term Loan", has_rate: false, has_spread: false, has_pik_rate: false, has_maturity: true}
          - {accession: C, context_id: n5, identifier_label: "Delta Co", has_rate: false, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: W, context_id: w4, identifier_label: "Wide Co | Loan", has_rate: true, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: W, context_id: w2, identifier_label: "Beta Co", has_rate: false, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: W, context_id: w3, identifier_label: "Beta Co | LP Interest", has_rate: false, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: R, context_id: r1, identifier_label: "Rho Co | Loan", has_rate: false, has_spread: false, has_pik_rate: false, has_maturity: true}
          - {accession: R, context_id: r2, identifier_label: "Rho Co | Loan B", has_rate: false, has_spread: true, has_pik_rate: false, has_maturity: false}
          - {accession: V, context_id: v1, identifier_label: "Vee Co | Notes", has_rate: true, has_spread: false, has_pik_rate: false, has_maturity: false}
          - {accession: V, context_id: v2, identifier_label: "Vee Co | Notes B", has_rate: true, has_spread: false, has_pik_rate: false, has_maturity: false}
      - input: ref('stg_reading_rule')
        rows:
          - {rule_id: par3, cik: "3", action: par_tagged_as_units, parameter: rows_near_cost, sel_accession: null, valid_from: null, valid_to: null, priority: 30, origin: "wrapper:par_tagged_as_units"}
          - {rule_id: par4w, cik: "4", action: par_tagged_as_units, parameter: whole_filing, sel_accession: W, valid_from: null, valid_to: null, priority: 30, origin: "wrapper:par_tagged_as_units"}
