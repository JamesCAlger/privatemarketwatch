      reported_in_usd: fund 1's euro fair value f1 takes it; fund 2's euro fair value f2 (no rule) is NOT touched and has
      no rule. Fund 1's second reported_in_usd rule starts in 2027, so it does not compete. to_usd: the euro principal
      p1's dollar field takes it; the dollar principal p2 is NOT touched (default as_filed). Fund 3 has two equally
      specific reported_in_usd rules: rule_conflict, no rule chosen. An absent cost has no rule. Fix round 1: a pure
