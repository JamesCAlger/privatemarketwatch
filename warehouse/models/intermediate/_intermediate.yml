      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: identifier_text_not_read}, name: baseline_cmp_rate_published_rate_kind_nsnl_identifier_text_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: printed_rate_type_and_loan_class_not_read}, name: baseline_cmp_rate_published_rate_kind_nsnl_printed_rate_type_and_loan_class_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: printed_reference_rate_column_not_read}, name: baseline_cmp_rate_published_rate_kind_nsnl_printed_reference_rate_column_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: production_corrected_no_loaded_store}, name: baseline_cmp_rate_published_rate_kind_nsnl_production_corrected_no_loaded_store}
      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: rate_only_context_not_adopted}, name: baseline_cmp_rate_published_rate_kind_nsnl_rate_only_context_not_adopted}
      - baseline_cmp_rate_cause: {arguments: {basis: published, field: rate_kind, cause: needs_store_not_loaded, detail: whole_coupon_pik_not_read}, name: baseline_cmp_rate_published_rate_kind_nsnl_whole_coupon_pik_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: interest_rate, cause: needs_store_not_loaded, detail: printed_reference_rate_column_not_read}, name: baseline_cmp_rate_unpublished_interest_rate_nsnl_printed_reference_rate_column_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: interest_rate_cash, cause: needs_store_not_loaded, detail: printed_reference_rate_column_not_read}, name: baseline_cmp_rate_unpublished_interest_rate_cash_nsnl_printed_reference_rate_column_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: interest_rate_cash, cause: convention, detail: cash_equals_all_in_owner_ruling}, name: baseline_cmp_rate_unpublished_interest_rate_cash_convention_cash_equals_all_in_owner_ruling}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: spread, cause: needs_store_not_loaded, detail: printed_reference_rate_column_not_read}, name: baseline_cmp_rate_unpublished_spread_nsnl_printed_reference_rate_column_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: maturity_date, cause: needs_store_not_loaded, detail: printed_maturity_not_read}, name: baseline_cmp_rate_unpublished_maturity_date_nsnl_printed_maturity_not_read}
      - baseline_cmp_rate_cause: {arguments: {basis: unpublished, field: rate_kind, cause: needs_store_not_loaded, detail: printed_reference_rate_column_not_read}, name: baseline_cmp_rate_unpublished_rate_kind_nsnl_printed_reference_rate_column_not_read}

  # Slice 5 Task 3: corrections applied to amounts and to the row set.
  - name: int_correction_target
    description: >
      Which row each loaded correction acts on. One row per (correction_id, target accession, target context_id); a
      correction with no target has one row with context_id null. key_resolution: context, row_id, identifier_native,
      production_bridge (owner decision 2, a NAMED DEBT: the row is found through production's holdings file and must
      be re-keyed by context before this layer can replace production), not_found. Keys are unique
      (tests/int_correction_keys_unique.sql).
    columns:
      - name: correction_id
        data_tests:
          - not_null
      - name: key_resolution
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [context, row_id, identifier_native, production_bridge, not_found]
      - name: target_count
        description: Contexts the key found (for an ambiguous bridge, the contexts production's rows name).
        data_tests:
          - not_null
    data_tests:
      - baseline_correction_count: {arguments: {column: key_resolution, key: production_bridge, ceiling_var: correction_target_max}, name: baseline_int_correction_target_production_bridge}
      - baseline_correction_count: {arguments: {column: key_resolution, key: not_found, ceiling_var: correction_target_max}, name: baseline_int_correction_target_not_found}

  - name: int_correction_fair_value_cell
    description: >
      The printed fair-value cell of each context a correction gives a fair value at step filed where the context has
      no fair-value fact, and whether it prints a dash or a zero (owner answer of 2026-11-24 on decision 4; the exact
      test is in the model's header).
    columns:
      - name: prints_dash_or_zero
        data_tests:
          - not_null

  - name: int_correction_screen
    description: >
      The outcomes of each correction target that need no normalised value (screen_outcome, screen_reason; null when the
      target goes on to the value stage), and what the correction sets (field_row, value_column).
    columns:
      - name: correction_id
        data_tests:
          - not_null

  - name: int_row_corrected
    description: >
      The position set after corrections: every position of int_source_row, plus each context a correction makes a
      position (row_reason correction_supplies_fair_value, correction_supplies_term, correction_adds_row). No role in
      int_source_row changes. Promotions are counted per row reason against a ceiling and checked against the role rules
      and production's published rows (tests/int_row_corrected_promotion_rules.sql,
      tests/int_row_corrected_promoted_in_production.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: context_id
        data_tests:
          - not_null
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: [position]
      - name: row_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [filed, correction_supplies_fair_value, correction_supplies_term, correction_adds_row]
    data_tests:
      - baseline_correction_count: {arguments: {column: row_reason, key: correction_supplies_fair_value, ceiling_var: row_corrected_promoted_max}, name: baseline_int_row_corrected_supplies_fair_value}
      - baseline_correction_count: {arguments: {column: row_reason, key: correction_supplies_term, ceiling_var: row_corrected_promoted_max}, name: baseline_int_row_corrected_supplies_term}
      - baseline_correction_count: {arguments: {column: row_reason, key: correction_adds_row, ceiling_var: row_corrected_promoted_max}, name: baseline_int_row_corrected_adds_row}

  - name: int_field_reread
    description: >
      The conversion chain's macros run again on the contexts corrections make positions and on the filed positions
      that carry a correction at step filed: run raw (before corrections) and run filed_corrected (after the step filed
      corrections replace their field's read). Run raw on a filed position equals int_field_normalised
      (tests/int_field_reread_raw_equals_normalised.sql).
    columns:
      - name: run
        data_tests:
          - accepted_values:
              arguments:
                values: [raw, filed_corrected]

  - name: int_correction_application
    description: >
      The outcome of each correction on each target: applied, no_op, rejected, failed, deferred, with a reason from the
      closed list (tests/int_correction_outcome_listed.sql), value_before and value_after as text, and the step it was
      applied at. Every correction has a row (tests/int_correction_none_dropped.sql); every applied row changes a field
      int_field_corrected holds (tests/int_correction_applied_changes_field.sql). One ceiling per outcome and reason.
      Agreement with production is not correctness: no check here sees a wrong correction.
    columns:
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [applied, no_op, rejected, failed, deferred]
    data_tests:
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "applied|", ceiling_var: correction_outcome_max}, name: baseline_int_correction_applied}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "no_op|evidence_only", ceiling_var: correction_outcome_max}, name: baseline_int_correction_no_op_evidence_only}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "no_op|procedure_not_built", ceiling_var: correction_outcome_max}, name: baseline_int_correction_no_op_procedure_not_built}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "no_op|equal_to_normalised", ceiling_var: correction_outcome_max}, name: baseline_int_correction_no_op_equal_to_normalised}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "no_op|already_absent", ceiling_var: correction_outcome_max}, name: baseline_int_correction_no_op_already_absent}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|target_not_found", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_target_not_found}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|bridge_ambiguous", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_bridge_ambiguous}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|target_not_position", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_target_not_position}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|conflict", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_conflict}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|expected_value_differs", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_expected_value_differs}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|printed_cell_not_found", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_printed_cell_not_found}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "rejected|printed_cell_not_dash_or_zero", ceiling_var: correction_outcome_max}, name: baseline_int_correction_rejected_printed_cell_not_dash_or_zero}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|value_not_numeric", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_value_not_numeric}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|value_not_date", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_value_not_date}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|unit_not_known", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_unit_not_known}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|no_fx_rate", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_no_fx_rate}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|conversion_unresolved", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_conversion_unresolved}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "deferred|field_not_held", ceiling_var: correction_outcome_max}, name: baseline_int_correction_deferred_field_not_held}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "deferred|no_companion_column", ceiling_var: correction_outcome_max}, name: baseline_int_correction_deferred_no_companion_column}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|value_not_known", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_value_not_known}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|legs_do_not_add", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_legs_do_not_add}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|pik_above_rate", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_pik_above_rate}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|kind_not_decidable", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_kind_not_decidable}
      - baseline_correction_count: {arguments: {column: "outcome || '|' || coalesce(reason, '')", key: "failed|rate_reading_unresolved", ceiling_var: correction_outcome_max}, name: baseline_int_correction_failed_rate_reading_unresolved}

  # Slice 5 Task 4: corrections on rates, and the adjacent rate-only context rule.
  - name: int_rate_adjacent
    description: >
      One row per taker context that takes the rate, cash-pay rate, PIK rate and spread facts of its neighbouring
      rate-only context (giver), under the fund rule adopt_adjacent_rate_context (owner decision 5; the structural test
      is in the model's header). Counted against a ceiling (tests/baseline_int_rate_adjacent_pairs.sql); no taker may be
      a context corrections make a position (tests/int_rate_adjacent_taker_is_filed_position.sql).
    columns:
      - name: taker_context_id
        data_tests:
          - not_null
      - name: giver_context_id
        data_tests:
          - not_null
      - name: rule_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_reading_rule')
                field: rule_id

  - name: int_rate_corrected_input
    description: >
      The inputs of the rate reading on each position a rate correction acts on, run before (no correction) and run
      corrected (each corrected input replaces its read; an explicit kind decides the interest_rate rule). The header
      says what each correction replaces and which rule a row read under a corrected kind names.
    columns:
      - name: run
        data_tests:
          - accepted_values:
              arguments:
                values: [before, corrected]

  - name: int_rate_corrected
    description: >
      The rate reading on int_rate_corrected_input, runs before and corrected, with each position's change flags and
      row_failure on run corrected. Run before equals the chain (tests/int_rate_corrected_before_equals_normalised.sql).
    columns:
      - name: row_failure
        data_tests:
          - accepted_values:
              arguments:
                values: [legs_do_not_add, pik_above_rate, kind_not_decidable, rate_reading_unresolved]

  - name: int_field_corrected
    description: >
      The corrected value of every field of every position after corrections, beside the filed and normalised values
      (never erase: tests/int_field_corrected_never_erase.sql). Amount fields (Task 3) and rate fields (Task 4: spread
      and maturity date replaced at step converted; interest_rate, its kind, the cash leg and the PIK rate from the
      rate reading run again on corrected inputs, int_rate_corrected) are corrected here. The legs check holds on the
      corrected values (tests/int_field_corrected_rate_legs.sql). status: normalised, absent, unresolved, corrected,
      withdrawn.
    data_tests:
      - baseline_corrected_amount_changed: {arguments: {field: interest_rate, ceiling_var: corrected_rate_changed_max}, name: baseline_int_field_corrected_published_interest_rate_changed}
      - baseline_corrected_amount_changed: {arguments: {field: interest_rate_cash, ceiling_var: corrected_rate_changed_max}, name: baseline_int_field_corrected_published_interest_rate_cash_changed}
      - baseline_corrected_amount_changed: {arguments: {field: pik_rate, ceiling_var: corrected_rate_changed_max}, name: baseline_int_field_corrected_published_pik_rate_changed}
      - baseline_corrected_amount_changed: {arguments: {field: spread, ceiling_var: corrected_rate_changed_max}, name: baseline_int_field_corrected_published_spread_changed}
      - baseline_corrected_amount_changed: {arguments: {field: maturity_date, ceiling_var: corrected_rate_changed_max}, name: baseline_int_field_corrected_published_maturity_date_changed}
      - baseline_corrected_amount_changed: {arguments: {field: fair_value}, name: baseline_int_field_corrected_published_fair_value_changed}
      - baseline_corrected_amount_changed: {arguments: {field: cost}, name: baseline_int_field_corrected_published_cost_changed}
      - baseline_corrected_amount_changed: {arguments: {field: principal_amount}, name: baseline_int_field_corrected_published_principal_amount_changed}
      - baseline_corrected_amount_changed: {arguments: {field: principal_amount_usd}, name: baseline_int_field_corrected_published_principal_amount_usd_changed}
      - baseline_corrected_amount_changed: {arguments: {field: shares}, name: baseline_int_field_corrected_published_shares_changed}
      - baseline_corrected_amount_changed: {arguments: {field: pct_of_net_assets}, name: baseline_int_field_corrected_published_pct_of_net_assets_changed}
      - baseline_correction_count: {arguments: {column: reason, key: rule_rerun_after_filed_correction, ceiling_var: corrected_field_reason_max}, name: baseline_int_field_corrected_rule_rerun}
    columns:
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [normalised, corrected, withdrawn, absent, unresolved]

  # Text slice P (page structure), 2026-11-26. Keys of all eight models: tests/int_page_keys_unique.sql. Counts:
  # docs/baseline_page_structure_2026-11-26.md. Nothing here says a printed value is right.
  - name: int_page_position
    description: >
      One row per position of int_source_row (published or not): the printed row of the fair-value fact int_field_read
      reads (visible placements only), with placement_status one_row, several_rows or not_placed. Only one_row carries
      a row. Published positions not placed or placed in several rows have baseline ceilings
      (tests/baseline_int_page_position_not_placed.sql, tests/baseline_int_page_position_several_rows.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: context_id
        data_tests:
          - not_null
      - name: is_published
        data_tests:
          - not_null
      - name: placement_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_row, several_rows, not_placed]

  - name: int_page_table
    description: >
      One row per schedule table (a printed table holding at least one position's printed row): its rows, modal width,
      position rows, and its header lines (header_status one_line, two_lines, none, ambiguous; header_form says which
      two-line layout). The exact header rules are in the model's header. Tables with no header taken have a baseline
      ceiling (tests/baseline_int_page_table_no_header.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: table_index
        data_tests:
          - not_null
      - name: width
        data_tests:
          - not_null
      - name: header_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_line, two_lines, none, ambiguous]
      - name: header_form
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [one_line, two_candidates, line_below, group_line_above, none, ambiguous]

  - name: int_page_cell
    description: >
      One row per non-empty cell of every row of the schedule tables, with its true columns (colspans summed, row
      spans from the row above resolved; deeper spans flagged, not resolved), its text and whether its row's width
      equals the table's. Rows whose width differs have a baseline ceiling (tests/baseline_int_page_cell_row_width.sql);
      rows that would need a deeper span another (tests/baseline_int_page_cell_deeper_span.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: row_index
        data_tests:
          - not_null
      - name: cell_index
        data_tests:
          - not_null
      - name: col_start
        data_tests:
          - not_null
      - name: col_end
        data_tests:
          - not_null
      - name: span_rule
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [none, span_from_row_above, deeper_span]
      - name: row_width_ok
        data_tests:
          - not_null

  - name: int_page_column
    description: >
      One row per leaf column of each schedule table with a header: its printed columns, the zone of columns whose
      data cells belong to it, header_text, sub_header_text and header_signature (lower case, footnote marks and white
      space removed). Each tagged field's placed facts should fall under one signature per table; the tables where they
      do not have a baseline ceiling (tests/baseline_int_page_field_split_columns.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: col_start
        data_tests:
          - not_null
      - name: zone_end
        data_tests:
          - not_null
      - name: header_text
        data_tests:
          - not_null
      - name: header_signature
        data_tests:
          - not_null

  - name: int_page_cell_column
    description: >
      One row per non-empty cell below the header of a schedule table with a header: its column and the rule that gave
      it (column_rule: zone, prefix_of_next for a currency marker before a number, trailing_footnote for the unheaded
      footnote-mark column, none_row_width_differs, none_left_of_first_leaf), and the cell's simple shape. Published
      positions whose printed row has no cell under any column, and placed field facts given no column, have baseline
      ceilings (tests/baseline_int_page_position_no_column.sql, tests/baseline_int_page_field_fact_no_column.sql).
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: column_rule
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [zone, prefix_of_next, trailing_footnote, none_row_width_differs, none_left_of_first_leaf]
      - name: shape
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [empty_marker, footnote_mark, date, percent, number, text]

  - name: int_page_column_filing
    description: >
      The column unit of a filing, one row per (accession, table_signature, header_signature) since fix round 1, so the
      fund's schedule, a joint venture's and an unfunded-commitment table are separate units: tables, data cells by
      shape (shares leave footnote marks out; their count is separate), and the filed facts placed under it counted by
      concept. Counts only; the next slice bundles it.
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: table_signature
        data_tests:
          - not_null
      - name: header_signature
        data_tests:
          - not_null
      - name: data_cells
        data_tests:
          - not_null

  - name: int_page_schedule
    description: >
      Fix round 1. One row per schedule table: its table_signature (leaf signatures in order), its normalised title and
      schedule_seq, the schedule it belongs to within the filing. A new schedule starts at a header change, a new title,
      or a non-schedule table in between (rules in the model's header). Headings do not carry across schedules.
    columns:
      - name: accession
        data_tests:
          - not_null
      - name: table_index
        data_tests:
          - not_null
      - name: schedule_seq
        data_tests:
          - not_null

  - name: int_page_heading
    description: >
      One row per heading row (no facts, exactly one non-empty cell, below the header of a schedule table with a
      header), its schedule, the run of consecutive headings it belongs to (run_length, run_position,
      depth_from_bottom; blank rows and a repeated header at a page break do not end a run), whether it is a page-top
      continuation, its level (fix round 2: the most frequent depth of its normalised text in the schedule, over
      occurrences that are not continuations; rules in the model's header), and plain features (is_continued,
      next_row_kind, seen_in_prior_filing). No meaning is assigned.
    columns:
      - name: level
        data_tests:
          - not_null
      - name: schedule_seq
        data_tests:
          - not_null
      - name: depth_from_bottom
        data_tests:
          - not_null
      - name: accession
        data_tests:
          - not_null
      - name: row_index
        data_tests:
          - not_null
      - name: text
        data_tests:
          - not_null
      - name: next_row_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [heading, position, other, end_of_table]

  - name: int_position_heading
    description: >
      For each position with a printed row and each heading level 0 to 3 (fix round 2), the nearest heading above it at
      that level in the same schedule, dropped if a higher-level heading that is not a continuation lies between,
      carried across the schedule's page tables, with rank by distance, distance in rows and whether the heading is in
      the same table. Sibling sections kept as parents have a baseline ceiling
      (tests/baseline_int_position_heading_sibling_sections.sql).
    columns:
      - name: context_id
        data_tests:
          - not_null
