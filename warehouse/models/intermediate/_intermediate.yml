            ('k2', 'shares', 3.0, 3.0, null, 'normalised', 'applied'),
            ('k3', 'principal_amount', null, null, null, 'absent', 'no_fact'),
            ('k3', 'principal_amount_usd', null, null, null, 'absent', 'no_fact'),
            ('k3', 'cost', 30.0, 30.0, null, 'normalised', 'applied'),
            ('k4', 'principal_amount', 10.0, 10.0, 'USD', 'normalised', 'applied'),
            ('k5', 'cost', 1.0, 1.0, null, 'normalised', 'applied')
          ) t(ctx, field, vf, v, cur, st, rs)
      - input: ref('int_field_reread')
        format: sql
        rows: |
          select run, 'A' as accession, ctx as context_id, field, vf as value_filed, v as value, cur as currency,
                 fx as fx_rate, null::date as value_date, null::varchar as rate_kind, act as action, rid as rule_id,
                 st as status, rs as reason
          from (values
            ('raw', 'p1', 'fair_value', null::double, null::double, null, null::double, null, null, 'absent', 'no_fact'),
            ('raw', 'p1', 'cost', 50.0, 50.0, null, null, 'as_filed', 'gd', 'normalised', 'applied'),
            ('filed_corrected', 'p1', 'fair_value', 0.0, 0.0, null, null, 'as_filed', 'gd', 'normalised', 'applied'),
            ('filed_corrected', 'p1', 'cost', 50.0, 50.0, null, null, 'as_filed', 'gd', 'normalised', 'applied'),
            ('filed_corrected', 'k3', 'principal_amount', 40.0, 40.0, 'EUR', null, 'as_filed', 'gdf', 'normalised', 'applied'),
            ('filed_corrected', 'k3', 'principal_amount_usd', 40.0, 50.0, null, 1.25, 'to_usd', 'fx', 'normalised', 'applied'),
            ('filed_corrected', 'k3', 'cost', 30.0, 30.0, null, null, 'as_filed', 'gd', 'normalised', 'applied')
          ) t(run, ctx, field, vf, v, cur, fx, act, rid, st, rs)
      - input: ref('int_correction_application')
        format: sql
        rows: |
          select id as correction_id, st as store, 'A' as accession, ctx as context_id, fr as field_row, vc as value_column,
                 step, 'applied' as outcome, w as is_withdrawal, num as number_after, txt as currency_after,
                 null::date as date_after
          from (values
            ('c1', 'row_corrections', 'k1', 'cost', 'value', 'converted', false, 200.0, null),
            ('c2', 'row_corrections', 'k2', 'shares', 'value', 'converted', true, null::double, null),
            ('c3', 'wrapper:untagged_values', 'k3', 'principal_amount', 'value', 'filed', false, 40.0, null),
            ('c4', 'row_corrections', 'k4', 'principal_amount', 'currency', 'companion', false, null, 'EUR'),
            ('c5', 'wrapper:untagged_values', 'p1', 'fair_value', 'value', 'filed', false, 0.0, null),
