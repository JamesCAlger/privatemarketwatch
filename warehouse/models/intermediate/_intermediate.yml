    description: >
      Slice 3 Task 3 fix round 1. The tie-break (step 2): fund 4 lists filing W under whole_filing and also has the
      row-feature rule rows_near_cost; both match t1 and t2 at priority 30, and the rule naming the filing wins
      (tie_break_losers 1). On t1 both rules give scale 1 (same effect); on t2 rows_near_cost would give scale 1,000
      (different effect). Still a conflict after step 2: fund 8 has two whole_filing rules naming the same filing (y1),
      fund 9 two rows_near_cost rules (z1). A missing row feature is an error, never "no match" (spec section 5 rule
      2): fund 10's rows_near_cost meets m1 with no label and m2 with no read cost, both feature_missing; fund 7's
      bracketed_unsigned meets s5, a fair value with no printed placement, feature_missing. Final fix wave F3: on t3 (no
