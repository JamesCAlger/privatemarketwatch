  - name: int_field_normalised_actions
    description: >
      Slice 3 Task 3. Invented rows: the value each action gives. as_filed and reported_in_usd keep the number;
      bracketed_unsigned flips the sign; to_usd uses the report date's quote or the latest earlier one within 7 days
      (p1: quote 4 days before, EUR 1.25) and leaves p2 unresolved (no_fx_rate) when the latest GBP quote is 11 days
      old; a dollar principal (p3) keeps its value under as_filed; cost_foreign_is_par takes the dollar fact as cost
      and the euro fact as the principal; par_tagged_as_units multiplies the count by the scale and empties shares;
      units_tagged_as_par copies the principal into shares; an action built in a later slice, a conflict, no rule, an
      absent field and an unresolved read each give their status and reason. Fix round 1: fraction_to_percent is built
      for share of net assets only (q1 0.01 becomes 1.0); named on shares it is not built (q2, NOT touched,
      action_not_built); feature_missing from the rule model gives unresolved feature_missing (m1).
