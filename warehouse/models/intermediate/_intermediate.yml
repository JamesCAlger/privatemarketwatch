  - name: int_correction_target_key_routes
    description: >
      Slice 5 Task 3. Each key route, in order. k1 names a context the filed layer has (context); k2 names a context it
      lacks (not_found). b2 names a production row id (row_id: accession and context of that row). i1 names identifier
      text that matches one position (identifier_native, target_count 1); i2 text that matches two positions of the
      filing (two rows, target_count 2) and one non-position context with the same label, which is not a target. i3 text
      that matches no position here and one production row (production_bridge, its src_context_id). i4 text that
      matches no position and production rows naming two contexts (one row, context null, target_count 2: the bridge
      does not pick). i5 text found nowhere (not_found). layer_field and step come from the seed row whose store_pattern
      matches; report_date is the target's when the correction has none (k1).
