        - {context_id: k2, field: shares, value_normalised: 3.0, value: null, status: withdrawn, reason: correction_withdrawn, correction_id: c2}
        - {context_id: k3, field: principal_amount, value_normalised: null, value: 40.0, status: corrected, reason: correction_filed, correction_id: c3}
