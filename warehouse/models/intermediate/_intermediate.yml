  - name: cmp_amount_cause_rules
    description: >
      Slice 3 Task 4 fix round 1. Invented rows, fund 1, filing A at 2026-03-31; seven field rows per context. Each
      cause rule with a row it must take and, where the review asked, one it must NOT: x1 fair value of opposite sign
      printed "(282" then ")" in a filing with a bracketed_unsigned rule -> new_wrong bracket_split_across_cells; x2 the
      same layout but the two sides share a sign -> NOT (not_yet_explained). x3 no cost read, a filer fact whose local
      name contains the standard cost name in a non-standard namespace -> new_wrong filer_concept_not_read; x4 an
      unrelated filer fact -> NOT. x5 principal empty in production, currency kept, class COMMON_EQUITY -> convention;
      x6 the same signature with class STRUCTURED_CREDIT and no class correction -> NOT convention (not_yet_explained
      principal_empty_class_not_equity); x7 the same with a loaded index-class correction -> old_wrong
      principal_emptied_then_reclassified. x8 shares with a label-keyed loaded correction that production names ->
      needs_correction; share of net assets that production names corrected with no loaded correction ->
      needs_store_not_loaded. x9 a count moved to principal here, kept as shares in production -> owner_review
      par_tagged on principal, currency, dollar principal and shares. x10 shares taken from the principal here,
      empty in production -> owner_review units_tagged. x11 a count principal on both sides, currency blank in
      production -> convention count_principal_currency_blank (principal and dollar principal equal). x12 share of net
      assets 0.526 kept by production, 52.6 here -> old_wrong. x13 sits in a quarter cmp_excluded_quarter lists and x14
      is new only: no rows. Fix round 2, each row reaching the rule's branch with no earlier rule taking it: x15 a cost
      correction loaded that production does not name -> needs_correction correction_loaded. Filing B has a
      units_tagged_as_par rule: x16 no shares here, production's shares equal this layer's principal -> owner_review
      units_tagged (second branch); x17 the same but production's shares differ from the principal -> NOT (refused by
      both branches). x18 shares taken from the principal here (units_tagged_as_par) while production also has shares
      -> NOT (first branch needs production empty). x19 share of net assets 0.3 kept unscaled by production -> NOT
      old_wrong (the rule needs a filed value above 0.50). x20 a principal read as filed in EUR, production's currency
      blank -> NOT count_principal_currency_blank (the rule needs a count principal written as USD). x21 a count moved
      to principal here whose filed count (2000) differs from production's shares (2500) -> NOT the par_tagged shares
      rule; its currency still takes count_principal_currency_blank (positive). Final fix wave F2 and F7: x5 is
      owner_review unverified_unit_count_read_as_principal (was convention). x15's correction carries production's cost
      (400) -> needs_correction. x22 a cost correction carrying 999 while production holds 400 and does not name the
      field -> NOT needs_correction (not_yet_explained correction_loaded_value_not_matched). x23 a principal correction
      of 1000 EUR: the principal (same value) and its currency (the correction's unit equals production's EUR) ->
      needs_correction; the dollar principal (production 1100; a EUR correction is not converted) -> NOT
      (not_yet_explained correction_loaded_value_not_matched).
