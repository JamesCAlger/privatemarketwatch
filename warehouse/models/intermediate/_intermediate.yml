                 'read' as status, false as is_nil, value_filed, unit, printed_text, fact_id
          from (values
            ('A', 'k1', 'interest_rate_tag', 13.0, 'utr:Rate', '13.00', 'f1'),
            ('A', 'k2', 'spread', 4.5, 'pure', '450', 'f2'),
            ('A', 'k3', 'interest_rate_tag', 6.1, 'pure', '610', 'f3'),
            ('A', 'k4', 'interest_rate_tag', 7.0, 'pure', '7.00', 'f4'),
            ('A', 'k5', 'pik_rate', 6.5, 'pure', '6.50', 'f5'),
