  - name: int_rate_adjacent_one_pair_three_refused
    description: >
      Slice 5 Task 4 (owner decision 5). One filing of fund 9, which declares the rule (r-adj), one period. Taken:
      giver c-11 (a rate fact, no fair value, cost or principal) and taker c-12 (fair value and principal, no rate
      fact), key 'alphaholdingsllc', context numbers one apart. Refused: c-21 / c-23 (numbers two apart); c-31, c-32,
      c-33 (one giver c-32 between two takers under one key: two candidates on the taker side); c-41 / c-42 (key 'dxco',
      under 8 characters). Fund 8 files a perfect pair c-51 / c-52 but declares no rule: not taken.
    model: int_rate_adjacent
    given:
      - input: ref('stg_reading_rule')
        rows:
          - {rule_id: r-adj, cik: "0000000009", action: adopt_adjacent_rate_context, sel_accession: null, valid_from: null, valid_to: null}
      - input: ref('stg_filed_filing')
        rows:
          - {accession: F9, cik: "0000000009", document_period_end_date: 2026-03-31}
          - {accession: F8, cik: "0000000008", document_period_end_date: 2026-03-31}
      - input: ref('int_context_feature')
        format: sql
        rows: |
          select acc as accession, ctx as context_id, cik, date '2026-03-31' as instant_date, true as has_identifier_member
              , label as identifier_label, fv as fair_value_fact_count, 0 as cost_fact_count, pr as has_principal
              , rt as has_rate, false as has_spread, false as has_pik_rate
          from (values
            ('F9', 'c-11', '0000000009', 'Alpha Holdings LLC, Loan', 0, false, true),
            ('F9', 'c-12', '0000000009', 'Alpha Holdings LLC | Loan', 1, true, false),
            ('F9', 'c-21', '0000000009', 'Beta Industries Inc, Loan', 0, false, true),
            ('F9', 'c-23', '0000000009', 'Beta Industries Inc, Loan', 1, true, false),
            ('F9', 'c-31', '0000000009', 'Gamma Partners LP, Loan A', 1, true, false),
            ('F9', 'c-32', '0000000009', 'Gamma Partners LP, Loan', 0, false, true),
            ('F9', 'c-33', '0000000009', 'Gamma Partners LP, Loan B', 1, true, false),
            ('F9', 'c-41', '0000000009', 'Dx Co', 0, false, true),
            ('F9', 'c-42', '0000000009', 'Dx Co', 1, true, false),
            ('F8', 'c-51', '0000000008', 'Delta Capital Corp, Loan', 0, false, true),
            ('F8', 'c-52', '0000000008', 'Delta Capital Corp, Loan', 1, true, false)
          ) t(acc, ctx, cik, label, fv, pr, rt)
