unit_tests:
  - name: cmp_row_set_catch_all_causes
    description: >
      Invented rows for the catch-all cause rules. Fund 1 at D1: this layer misses the filed total by 100m and the one
      held row (production only, unresolved, fair value 100m) closes it -> new_wrong. Same fund at D2: the held row
      (100m) does not close the gap (300m) -> owner_review. A held row with fair value 0 is never tested by the tie ->
      owner_review. A production-only row that is not_schedule with no correction is NOT owner_review ->
      not_yet_explained. New-only cash row in a filing production has -> convention; a new-only row that is not cash
      -> not_yet_explained (not convention). A loaded relabel is not a cause (Task 5 fix round 1): the relabelled
      production-only rows h1 and z1 still reach the total-tie rules, and the relabelled new-only row r1 is
      not_yet_explained with detail relabel_loaded. A new-only cash row in a quarter production has no rows for is
      left out of the comparison (no row, owner 2026-11-19). A JV-schedule held row -> owner_review (no filed total).
    model: cmp_row_set
    given:
      - input: ref('stg_holdings')
        rows:
          - {cik: "1", report_date: 2026-01-31, accession_number: A1, src_context_id: p1, accounting_record_class: parent_schedule, fair_value: 900000000, corrected_fields: null}
          - {cik: "1", report_date: 2026-01-31, accession_number: A1, src_context_id: h1, accounting_record_class: parent_schedule, fair_value: 100000000, corrected_fields: null}
          - {cik: "1", report_date: 2026-01-31, accession_number: A1, src_context_id: z1, accounting_record_class: parent_schedule, fair_value: 0, corrected_fields: null}
          - {cik: "1", report_date: 2026-01-31, accession_number: A1, src_context_id: x1, accounting_record_class: parent_schedule, fair_value: 5, corrected_fields: null}
          - {cik: "1", report_date: 2026-01-31, accession_number: A1, src_context_id: j1, accounting_record_class: underlying_schedule, fair_value: 7, corrected_fields: null}
          - {cik: "1", report_date: 2026-02-28, accession_number: A2, src_context_id: p2, accounting_record_class: parent_schedule, fair_value: 800000000, corrected_fields: null}
          - {cik: "1", report_date: 2026-02-28, accession_number: A2, src_context_id: h2, accounting_record_class: parent_schedule, fair_value: 100000000, corrected_fields: null}
      - input: ref('int_source_row')
        rows:
          - {accession: A1, context_id: p1, cik: "1", report_date: 2026-01-31, role: position, role_rule: 9, reason: position, is_cash: false, is_published: true, cash_pattern_id: null}
          - {accession: A1, context_id: h1, cik: "1", report_date: 2026-01-31, role: unresolved, role_rule: 9, reason: "no rule removes it, but no term fact", is_cash: false, is_published: false, cash_pattern_id: null}
          - {accession: A1, context_id: z1, cik: "1", report_date: 2026-01-31, role: unresolved, role_rule: 9, reason: "no rule removes it, but no term fact", is_cash: false, is_published: false, cash_pattern_id: null}
          - {accession: A1, context_id: x1, cik: "1", report_date: 2026-01-31, role: not_schedule, role_rule: 3, reason: "no fair value", is_cash: false, is_published: false, cash_pattern_id: null}
          - {accession: A1, context_id: j1, cik: "1", report_date: 2026-01-31, role: unresolved, role_rule: 7, reason: "scope JV by set_scope, but no term fact", is_cash: false, is_published: false, cash_pattern_id: null}
          - {accession: A1, context_id: c1, cik: "1", report_date: 2026-01-31, role: position, role_rule: 9, reason: "position; money market", is_cash: true, is_published: true, cash_pattern_id: r5_money_market}
          - {accession: A1, context_id: n1, cik: "1", report_date: 2026-01-31, role: position, role_rule: 9, reason: position, is_cash: false, is_published: true, cash_pattern_id: null}
          - {accession: A1, context_id: r1, cik: "1", report_date: 2026-01-31, role: position, role_rule: 9, reason: position, is_cash: false, is_published: true, cash_pattern_id: null}
          - {accession: A2, context_id: p2, cik: "1", report_date: 2026-02-28, role: position, role_rule: 9, reason: position, is_cash: false, is_published: true, cash_pattern_id: null}
          - {accession: A2, context_id: h2, cik: "1", report_date: 2026-02-28, role: unresolved, role_rule: 9, reason: "no rule removes it, but no term fact", is_cash: false, is_published: false, cash_pattern_id: null}
          - {accession: A3, context_id: c3, cik: "1", report_date: 2026-03-31, role: position, role_rule: 9, reason: "position; money market", is_cash: true, is_published: true, cash_pattern_id: r5_money_market}
      - input: ref('int_context_feature')
        rows:
          - {accession: A1, context_id: p1, identifier_label: "Alpha | Loan", fair_value: 900000000, fair_value_fact_count: 1}
          - {accession: A1, context_id: h1, identifier_label: "Beta | LP interest", fair_value: 100000000, fair_value_fact_count: 1}
          - {accession: A1, context_id: z1, identifier_label: "Gamma | Revolver", fair_value: 0, fair_value_fact_count: 1}
          - {accession: A1, context_id: x1, identifier_label: "Delta | Loan", fair_value: null, fair_value_fact_count: 0}
          - {accession: A1, context_id: j1, identifier_label: "Eps | Loan, JV", fair_value: 7, fair_value_fact_count: 1}
          - {accession: A1, context_id: c1, identifier_label: "Some Money Market Fund", fair_value: 50, fair_value_fact_count: 1}
          - {accession: A1, context_id: n1, identifier_label: "Zeta | Loan", fair_value: 0, fair_value_fact_count: 1}
          - {accession: A1, context_id: r1, identifier_label: "Wrong Co, Common Equity", fair_value: 0, fair_value_fact_count: 1}
          - {accession: A2, context_id: p2, identifier_label: "Alpha | Loan", fair_value: 800000000, fair_value_fact_count: 1}
          - {accession: A2, context_id: h2, identifier_label: "Beta | LP interest", fair_value: 100000000, fair_value_fact_count: 1}
          - {accession: A3, context_id: c3, identifier_label: "Some Money Market Fund", fair_value: 60, fair_value_fact_count: 1}
      - input: ref('stg_fund_financials')
        rows:
          - {cik: "1", report_date: 2026-01-31, investments_at_fair_value: 1000000000}
          - {cik: "1", report_date: 2026-02-28, investments_at_fair_value: 1100000000}
      - input: ref('stg_filed_fact')
        rows:
          - {accession: A1, context_id: p1, concept_local: InvestmentOwnedAtFairValue, concept_namespace: "http://fasb.org/us-gaap/2025"}
      - input: ref('concept_map')
        rows:
          - {concept_map_id: cm_rate, field: rate, concept_local: InvestmentInterestRate, namespace_pattern: "http://fasb.org/us-gaap/*"}
      - input: ref('stg_correction')
        rows:
          - {accession: A9, context_id: q9, kind: value, field: fair_value}
          - {accession: A1, context_id: r1, kind: relabel, field: identifier}
          - {accession: A1, context_id: h1, kind: relabel, field: identifier}
          - {accession: A1, context_id: z1, kind: relabel, field: identifier}
      - input: ref('stg_reading_not_loaded')
        rows:
          - {cik: "9", wrapper_key: rate_only_contexts}
    expect:
      rows:
        - {basis: published, context_id: p1, side: both, cause: null, cause_detail: null}
        - {basis: published, context_id: h1, side: production_only, cause: new_wrong, cause_detail: held_unresolved_ties_filed_total}
        - {basis: published, context_id: z1, side: production_only, cause: owner_review, cause_detail: held_unresolved_d5}
        - {basis: published, context_id: x1, side: production_only, cause: not_yet_explained, cause_detail: none}
        - {basis: unpublished, context_id: j1, side: production_only, cause: owner_review, cause_detail: held_unresolved_d5}
        - {basis: published, context_id: c1, side: new_only, cause: convention, cause_detail: cash_published_d7_seed_pattern}
        - {basis: published, context_id: n1, side: new_only, cause: not_yet_explained, cause_detail: none}
        - {basis: published, context_id: r1, side: new_only, cause: not_yet_explained, cause_detail: relabel_loaded}
        - {basis: published, context_id: p2, side: both, cause: null, cause_detail: null}
        - {basis: published, context_id: h2, side: production_only, cause: owner_review, cause_detail: held_unresolved_d5}

  - name: cmp_row_set_early_causes
    description: >
      Final fix wave F8. Invented rows for the rules that do not need the fund total, fund 2 at one date.
      needs_correction fires only where the correction's field is what this side lacks: f1 (a fair-value correction,
      rule 3 no fair-value fact) and t1 (a principal correction, unresolved for want of a term fact) get it; w1 (a
      principal correction on a row that lacks a fair value) and w2 (a fair-value correction on a row that lacks a term
      fact) do not, and fall through to not_yet_explained and owner_review. needs_store_not_loaded: a1 (production
      added the row) and the pair q1 / q2 (the production row carries a us-gaap rate fact and no fair value, and the fund
      has an unloaded rate_only_contexts declaration). The pair q3 / q4 is the same except that q3's rate fact is in the
      filer's namespace, which is not a rate fact (F5), so both fall through. Cash convention: k1 (seed cash pattern) and
      k2 (fund cash rule) get it, the detail naming the source; k3 (cash on rule 8, no named source) does not.
      Slice 3 Task 1: k4 (a cash row matched by both a fund cash rule and a seed pattern) names the fund rule (item e);
      t2 (a principal correction on a row held unresolved at rule 7 for two scopes, no term fact) is not
      needs_correction, because it is held for its scopes, not for want of a term fact; it falls through to owner_review
      (item d).
    model: cmp_row_set
    given:
      - input: ref('stg_holdings')
        rows:
          - {cik: "2", report_date: 2026-03-31, accession_number: B1, src_context_id: p0, accounting_record_class: parent_schedule, fair_value: 10, corrected_fields: null}
          - {cik: "2", report_date: 2026-03-31, accession_number: B1, src_context_id: f1, accounting_record_class: parent_schedule, fair_value: 11, corrected_fields: "fair_value"}
          - {cik: "2", report_date: 2026-03-31, accession_number: B1, src_context_id: t1, accounting_record_class: parent_schedule, fair_value: 12, corrected_fields: "principal_amount"}
          - {cik: "2", report_date: 2026-03-31, accession_number: B1, src_context_id: w1, accounting_record_class: parent_schedule, fair_value: 13, corrected_fields: "principal_amount"}
