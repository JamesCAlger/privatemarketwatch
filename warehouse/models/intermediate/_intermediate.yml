  - name: cmp_row_set_catch_all_causes
    description: >
      Invented rows for the catch-all cause rules. Fund 1 at D1: this layer misses the filed total by 100m and the one
      held row (production only, unresolved, fair value 100m) closes it -> new_wrong. Same fund at D2: the held row
      (100m) does not close the gap (300m) -> owner_review. A held row with fair value 0 is never tested by the tie ->
      owner_review. A production-only row that is not_schedule with no correction is NOT owner_review ->
      not_yet_explained. New-only cash row in a filing production has -> convention; a new-only row that is not cash
      -> not_yet_explained (not convention). A loaded relabel is not a cause (Task 5 fix round 1): the relabelled
      production-only rows h1 and z1 still reach the total-tie rules, and the relabelled new-only row r1 is
      not_yet_explained with detail relabel_loaded. A new-only cash row in a quarter production has no rows for is
      left out of the comparison (no row, owner 2026-11-19). A JV-schedule held row -> owner_review (no filed total).
      Slice 5 Task 5: this side is int_row_corrected (here the filed positions only) and this layer's total for the tie
      is the corrected fair value (int_field_corrected); the outcomes are unchanged.
