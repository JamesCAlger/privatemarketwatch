      code on this branch), no spread (pik_is_coupon). pik_only_is_margin (p2): the spread is the PIK rate 12.5, the
      rate unresolved (pik_is_margin). p3: the coupon reading on a PIK rate filed as 2.5 in pure: scale_not_decided on
      the rate, its cash leg and the PIK rate. Spread: s1 fraction_to_percent 6.25; s2 7.5 in pure scale_not_decided; s3
      text_not_read (fix round 1); s6 feature_missing still passes through as its own reason; s4 two values, no rule
      (values_differ carried); s5 a unit that is not a ratio, no rule (no_rule).
