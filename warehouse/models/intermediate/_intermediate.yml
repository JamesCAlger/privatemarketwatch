    description: >
      Text slice P3, rules revised in fix rounds 1 and 2. Leaves "reference" (printed 2-3, zone 2-5) and
      "paramount/units" (printed 6-8, zone 6-11). zone: '4.75%' at 2, '5/8/2030' at 3, 'SOFR +' at 4 (text in the gap
      stays in the zone). prefix_of_next: '$' at 6 then '60,260' (same column); 'A$' at 4, inside the zone of
      "reference", then '9,900' at 6: the marker takes the number's column (the case the zone rule got wrong). A marker
      followed by text ('£' then 'N/A') stays in its zone. trailing_footnote: '(2)(11)' at 9, past the printed columns
      of "paramount/units", goes to the unheaded '#footnote_marks' column. none_left_of_first_leaf: 'Acme' at 0.
      none_row_width_differs: a row whose width is not the table's gives no column. Bracketed digits (fix round 2):
      '(110)' at 2 with a fact placed is a number; '(110)' at 7 with no fact is a number because other cells of
      "paramount/units" (inside its printed columns, same table signature) hold placed numeric facts ('60,260'); '(4)'
      at 10, in the gap where no numeric fact is placed, is a footnote mark (trailing_footnote); '(4)(5)' at 7 is a
      footnote mark although its column holds numbers. The header row and a table without a header give no rows.
