  - name: int_row_corrected_row_rules
    description: >
      Slice 5 Task 3. The row rule. Promoted: f1 not_schedule by rule 3 with no fair-value fact and a fair value that
      passes the screen (correction_supplies_fair_value); t1 unresolved by rule 9 with no term fact and a principal
      (correction_supplies_term); a1 not_schedule by rule 1 with an add_row fair value (correction_adds_row); p1 a
      filed position (filed, no correction ids). Must NOT promote: n1 a cost on a not_schedule rule 3 context (cost
      supplies neither a fair value nor a term); n2 a principal on a row held unresolved for two scopes; n3 a fair-value
      withdrawal; n4 a fair value the screen rejected; n5 a fair value on a not_schedule rule 3 context that does carry
      a fair-value fact (its facts disagree, so rule 3 left it out for another reason). t1's scope is the source row's.
    model: int_row_corrected
    given:
      - input: ref('int_source_row')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, '1' as cik, date '2026-03-31' as report_date, role, rr as role_rule,
                 scope, false as is_cash, h2 as held_for_two_scopes
          from (values
            ('p1', 'position', 9, 'fund', false), ('f1', 'not_schedule', 3, 'fund', false),
            ('t1', 'unresolved', 9, 'fund', false), ('a1', 'not_schedule', 1, 'fund', false),
            ('n1', 'not_schedule', 3, 'fund', false), ('n2', 'unresolved', 7, 'JV A; JV B', true),
            ('n3', 'not_schedule', 3, 'fund', false), ('n4', 'not_schedule', 3, 'fund', false),
            ('n5', 'not_schedule', 3, 'fund', false)
          ) t(ctx, role, rr, scope, h2)
      - input: ref('int_context_feature')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, term as has_term_fact, n as fair_value_fact_count
          from (values
            ('p1', true, 1), ('f1', true, 0), ('t1', false, 1), ('a1', false, 1), ('n1', true, 0), ('n2', false, 1),
            ('n3', true, 0), ('n4', true, 0), ('n5', true, 2)
          ) t(ctx, term, n)
      - input: ref('int_correction_screen')
        format: sql
        rows: |
          select id as correction_id, kind, 'A' as accession, ctx as context_id, role as target_role, fr as field_row,
                 'value' as value_column, w as is_withdrawal, so as screen_outcome
          from (values
            ('cf1', 'value', 'f1', 'not_schedule', 'fair_value', false, null),
            ('ct1', 'value', 't1', 'unresolved', 'principal_amount', false, null),
            ('ca1', 'add_row', 'a1', 'not_schedule', 'fair_value', false, null),
            ('ca2', 'add_row', 'a1', 'not_schedule', 'cost', false, null),
            ('cn1', 'value', 'n1', 'not_schedule', 'cost', false, null),
            ('cn2', 'value', 'n2', 'unresolved', 'principal_amount', false, null),
            ('cn3', 'value', 'n3', 'not_schedule', 'fair_value', true, null),
            ('cn4', 'value', 'n4', 'not_schedule', 'fair_value', false, 'rejected'),
            ('cn5', 'value', 'n5', 'not_schedule', 'fair_value', false, null),
            ('cp1', 'value', 'p1', 'position', 'cost', false, null)
          ) t(id, kind, ctx, role, fr, w, so)
    expect:
      rows:
        - {context_id: p1, role_filed: position, role: position, is_published: true, scope: fund, row_correction_ids: null, row_reason: filed}
        - {context_id: f1, role_filed: not_schedule, role: position, is_published: true, scope: fund, row_correction_ids: cf1, row_reason: correction_supplies_fair_value}
        - {context_id: t1, role_filed: unresolved, role: position, is_published: true, scope: fund, row_correction_ids: ct1, row_reason: correction_supplies_term}
        - {context_id: a1, role_filed: not_schedule, role: position, is_published: true, scope: fund, row_correction_ids: ca1, row_reason: correction_adds_row}

  - name: int_correction_application_outcomes
    description: >
      Slice 5 Task 3. The value stage, after the screen. a1 a cost of 200 where the normalised cost is 100 (applied);
      q1 a cost of 100.4 (no_op equal_to_normalised: dollars differ by less than 1); w1 a withdrawal on an absent cost
      (no_op already_absent); w2 a withdrawal on a cost of 100 (applied); np a cost on a context that is not a position
      after corrections (rejected target_not_position); f1 a principal at step filed in EUR whose dollar value has no
      quote (failed no_fx_rate); f2 a fair value at step filed on a promoted row whose fair value was absent (applied;
      value_after the converted value 0); u1 a cost currency USD on a cost read in iso4217:USD (no_op
      equal_to_normalised: int_field_normalised leaves the cost currency empty, the read unit gives it); u2 a principal
      currency EUR where the normalised currency is USD (applied); s1 a target the screen deferred keeps its outcome.
      Slice 5 Task 4, step reading_input (int_rate_corrected gives the reading after the corrections): r1 a PIK rate 3
      that changes the input (applied; value_before and value_after are the PIK row before and after the reading, 1
      and 3); r2 a kind all_in equal to the kind before (no_op equal_to_normalised); r3 a PIK rate on a row whose
      corrected reading fails (failed pik_above_rate: never stored).
    model: int_correction_application
    given:
      - input: ref('int_correction_screen')
        format: sql
        rows: |
          select id as correction_id, 'row_corrections' as store, 'value' as kind, '1' as cik, 'A' as accession,
                 ctx as context_id, fr as field, fr as layer_field, step, 'context' as key_resolution, 1 as target_count,
                 'position' as target_role, date '2026-03-31' as report_date, fr as field_row, vc as value_column,
                 w as is_withdrawal, num as value_number, txt as value_text, so as screen_outcome, sr as screen_reason,
                 null::date as value_date
          from (values
            ('a1', 'k1', 'cost', 'converted', 'value', false, 200.0, null, null, null),
            ('q1', 'k1', 'cost', 'converted', 'value', false, 100.4, null, null, null),
            ('w1', 'k2', 'cost', 'converted', 'value', true, null::double, null, null, null),
            ('w2', 'k3', 'cost', 'converted', 'value', true, null, null, null, null),
            ('np', 'z9', 'cost', 'converted', 'value', false, 5.0, null, null, null),
            ('f1', 'k4', 'principal_amount', 'filed', 'value', false, 40.0, null, null, null),
            ('f2', 'p1', 'fair_value', 'filed', 'value', false, 0.0, null, null, null),
            ('u1', 'k1', 'cost', 'companion', 'currency', false, null, 'USD', null, null),
            ('u2', 'k4', 'principal_amount', 'companion', 'currency', false, null, 'EUR', null, null),
            ('s1', 'k1', 'issuer_name', 'deferred', null, false, null, null, 'deferred', 'field_not_held'),
            ('r1', 'k5', 'pik_rate', 'reading_input', 'value', false, 3.0, null, null, null),
            ('r2', 'k5', 'interest_rate', 'reading_input', 'rate_kind', false, null, 'ALL_IN', null, null),
            ('r3', 'k6', 'pik_rate', 'reading_input', 'value', false, 9.0, null, null, null)
          ) t(id, ctx, fr, step, vc, w, num, txt, so, sr)
      - input: ref('int_row_corrected')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, rr as row_reason
          from (values ('k1', 'filed'), ('k2', 'filed'), ('k3', 'filed'), ('k4', 'filed'),
                       ('p1', 'correction_supplies_fair_value'), ('k5', 'filed'), ('k6', 'filed')) t(ctx, rr)
      - input: ref('int_field_normalised')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, field, value, currency, null::double as fx_rate, status,
                 null::date as value_date, rk as rate_kind
          from (values
            ('k1', 'cost', 100.0, null, 'normalised', null::varchar), ('k2', 'cost', null, null, 'absent', null),
            ('k3', 'cost', 100.0, null, 'normalised', null), ('k4', 'principal_amount', 10.0, 'USD', 'normalised', null),
            ('k5', 'pik_rate', 1.0, null, 'normalised', null), ('k5', 'interest_rate', 10.0, null, 'normalised', 'all_in'),
            ('k6', 'pik_rate', 1.0, null, 'normalised', null)
          ) t(ctx, field, value, currency, status, rk)
      - input: ref('int_rate_corrected')
        format: sql
        rows: |
          select 'corrected' as run, 'A' as accession, ctx as context_id, field, v as value, rk as rate_kind,
                 pkc as pk_changed, kc as kind_changed, false as it_changed, false as ct_changed, rf as row_failure
          from (values
            ('k5', 'pik_rate', 3.0, null::varchar, true, false, null::varchar),
            ('k5', 'interest_rate', 10.0, 'all_in', true, false, null),
            ('k6', 'pik_rate', 9.0, null, true, false, 'pik_above_rate')
          ) t(ctx, field, v, rk, pkc, kc, rf)
      - input: ref('int_field_read')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, field, unit
          from (values ('k1', 'cost', 'iso4217:USD'), ('k3', 'cost', 'iso4217:USD'),
                       ('k4', 'principal_amount', 'iso4217:USD')) t(ctx, field, unit)
      - input: ref('int_field_reread')
        format: sql
        rows: |
          select run, 'A' as accession, ctx as context_id, field, value, null::varchar as currency, null::double as fx_rate,
                 status, reason, unit as read_unit, null::date as value_date, null::varchar as rate_kind
          from (values
            ('raw', 'p1', 'fair_value', null::double, 'absent', 'no_fact', null),
            ('filed_corrected', 'p1', 'fair_value', 0.0, 'normalised', 'applied', 'iso4217:USD'),
            ('filed_corrected', 'k4', 'principal_amount', 40.0, 'normalised', 'applied', 'iso4217:EUR'),
            ('filed_corrected', 'k4', 'principal_amount_usd', null, 'unresolved', 'no_fx_rate', null)
          ) t(run, ctx, field, value, status, reason, unit)
    expect:
      rows:
        - {correction_id: a1, outcome: applied, reason: null, value_before: "100.0", value_after: "200.0", applied_at_step: converted}
        - {correction_id: q1, outcome: no_op, reason: equal_to_normalised, value_before: "100.0", value_after: "100.4", applied_at_step: null}
        - {correction_id: w1, outcome: no_op, reason: already_absent, value_before: null, value_after: null, applied_at_step: null}
        - {correction_id: w2, outcome: applied, reason: null, value_before: "100.0", value_after: null, applied_at_step: converted}
        - {correction_id: np, outcome: rejected, reason: target_not_position, value_before: null, value_after: null, applied_at_step: null}
        - {correction_id: f1, outcome: failed, reason: no_fx_rate, value_before: "10.0", value_after: "40.0", applied_at_step: null}
        - {correction_id: f2, outcome: applied, reason: null, value_before: null, value_after: "0.0", applied_at_step: filed}
        - {correction_id: u1, outcome: no_op, reason: equal_to_normalised, value_before: USD, value_after: USD, applied_at_step: null}
        - {correction_id: u2, outcome: applied, reason: null, value_before: USD, value_after: EUR, applied_at_step: companion}
        - {correction_id: s1, outcome: deferred, reason: field_not_held, value_before: null, value_after: null, applied_at_step: null}
        - {correction_id: r1, outcome: applied, reason: null, value_before: "1.0", value_after: "3.0", applied_at_step: reading_input}
        - {correction_id: r2, outcome: no_op, reason: equal_to_normalised, value_before: all_in, value_after: all_in, applied_at_step: null}
        - {correction_id: r3, outcome: failed, reason: pik_above_rate, value_before: "1.0", value_after: "9.0", applied_at_step: null}

  - name: int_field_corrected_applies_values
    description: >
      Slice 5 Task 3. How applied corrections land, never erasing. k1: a converted cost (corrected, value 200, value
      normalised 100 kept beside it); its principal untouched (normalised, no correction id). k2: a withdrawn shares
      count (withdrawn, value null). k3: a principal at step filed in EUR on a filed position: the principal and the
      dollar principal take run filed_corrected (corrected; reasons correction_filed and
      derived_from_corrected_principal; the rule of that run); the cost the run did not change keeps its value and
      status. k4: a principal currency companion alone (value unchanged, currency EUR, status corrected, reason
      companion_corrected). p1: a promoted row, before corrections from run raw: its fair value set at step filed
      (corrected 0) and its cost from the raw run (normalised 50, no correction). k5: two applied corrections of one
      value: the one from row_corrections_by_context is named.
