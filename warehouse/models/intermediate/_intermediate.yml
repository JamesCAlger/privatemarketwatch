        - {context_id: p1, field: fair_value, value_normalised: null, value: 0.0, status: corrected, reason: correction_filed, correction_id: c5}
        - {context_id: p1, field: cost, value_normalised: 50.0, value: 50.0, status: normalised, reason: applied, correction_id: null}
        - {context_id: k5, field: cost, value_normalised: 1.0, value: 2.0, status: corrected, reason: correction_converted, correction_id: c6b}

  - name: int_rate_corrected_reading
    description: >
      Slice 5 Task 4. The rate reading on corrected inputs, five positions under the fund rule rate_is_all_in (r1) with
      the PIK rate read by fraction_to_percent (gd). a1: a corrected rate 12 under kind all_in (PIK 2 kept): all-in
      12, cash 10. b1: a corrected rate 8 with a corrected kind cash (kind before all_in): the rule becomes the kind
      correction kb, action rate_is_cash_leg, all-in 8 + 2 = 10, cash 8, kind cash. c1: a corrected PIK rate 3 (before
      1) changes the cash leg from 9 to 7. d1: a withdrawn PIK rate: the PIK row is absent (correction_withdrawn) and the
      cash leg equals the all-in rate (owner ruling A). e1: rate tag 10 and cash-pay tag 9 with a PIK rate 1 add up
      before; the corrected PIK rate 3 makes them not add: the reading leaves both legs unresolved (legs_do_not_add)
      and the row fails (row_failure legs_do_not_add on every corrected row of e1).
    model: int_rate_corrected
    given:
      - input: ref('int_rate_corrected_input')
        format: sql
        rows: |
          select run, 'A' as accession, ctx as context_id, '1' as cik, date '2026-03-31' as report_date
              , case when kb is not null and run = 'corrected' then kb else 'r1' end as ir_rule_id
              , case when kb is not null and run = 'corrected' then 'rate_is_cash_leg' else 'rate_is_all_in' end as ir_action
              , 'rule' as ir_resolution, true as ir_is_built
              , 'gd' as pk_rule_id, 'fraction_to_percent' as pk_action, 'rule' as pk_resolution, true as pk_is_built
              , null::varchar as sp_rule_id, null::varchar as sp_action, null::varchar as sp_resolution, null::boolean as sp_is_built
              , null::varchar as md_rule_id, null::varchar as md_action, null::varchar as md_resolution, null::boolean as md_is_built
