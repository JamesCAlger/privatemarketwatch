                 case when value_filed is null then 'no_fact' else 'one_fact' end as reason,
                 value_filed, null::date as value_date, case when value_filed is null then null when field = 'shares' then 'shares' else 'iso4217:USD' end as unit,
                 false as is_nil, null as fact_id
          from (values
            ('C', 'n1', '3', 1000.0, 1000.0), ('C', 'n2', '3', 1000.0, 1000.0), ('C', 'n3', '3', 5.0, 5000.0),
