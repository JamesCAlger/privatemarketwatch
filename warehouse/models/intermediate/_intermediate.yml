  # Text slice P (page structure), 2026-11-26.
  - name: int_page_cell_columns_and_rowspan
    description: >
      Text slice P2. Table A/1, width 6. Row 10: cumulative starts ("Co" colspan 2 at 0, "Int" colspan 3 at 2; the
      empty cell takes column 5 but is not kept). Row 11: "Co" spans two rows, so the row's cells are laid into the
      free columns 2 to 5 (Cash 2, PIK 3, X 4-5), not at 0, 1, 2 (the two-line header case). Row 12: "$" and the number
      after it at their own columns. Row 13: "T" spans three rows: row 14 is covered from the row above (v at 2-5),
      row 15 from two rows above (deeper_span: naive start 0 kept and flagged). Row 16: text white space and a
      no-break space collapse ("z z"); the no-break-space-only cell is dropped; width 4 is not the table's. Table 2 is
      not a schedule table: no rows.
    model: int_page_cell
    given:
      - input: ref('int_page_table')
        rows:
          - {accession: A, table_index: 1, width: 6}
      - input: ref('stg_filed_document_row')
        format: sql
        rows: |
          select acc as accession, ti as table_index, ri as row_index, rit as row_in_table, fc as fact_count,
                 len(cells) as cell_count, cells, cs as cell_colspans, rs as cell_rowspans
          from (values
            ('A', 1, 10, 0, 0, ['Co', 'Int', ''], [2, 3, 1], [2, 1, 1]),
            ('A', 1, 11, 1, 0, ['Cash', 'PIK', 'X'], [1, 1, 2], [1, 1, 1]),
            ('A', 1, 12, 2, 2, ['a', '$', '5', '7'], [2, 1, 1, 2], [1, 1, 1, 1]),
            ('A', 1, 13, 3, 0, ['T', 'u'], [2, 4], [3, 1]),
            ('A', 1, 14, 4, 0, ['v'], [4], [1]),
            ('A', 1, 15, 5, 0, ['w'], [4], [1]),
            ('A', 1, 16, 6, 0, [' z  z ', chr(160)], [3, 1], [1, 1]),
            ('A', 2, 20, 0, 0, ['other'], [1], [1])
          ) t(acc, ti, ri, rit, fc, cells, cs, rs)
    expect:
      rows:
        - {row_index: 10, cell_index: 0, col_start: 0, col_end: 1, text: Co, span_rule: none, row_width_ok: true}
        - {row_index: 10, cell_index: 1, col_start: 2, col_end: 4, text: Int, span_rule: none, row_width_ok: true}
        - {row_index: 11, cell_index: 0, col_start: 2, col_end: 2, text: Cash, span_rule: span_from_row_above, row_width_ok: true}
        - {row_index: 11, cell_index: 1, col_start: 3, col_end: 3, text: PIK, span_rule: span_from_row_above, row_width_ok: true}
        - {row_index: 11, cell_index: 2, col_start: 4, col_end: 5, text: X, span_rule: span_from_row_above, row_width_ok: true}
        - {row_index: 12, cell_index: 0, col_start: 0, col_end: 1, text: a, span_rule: none, row_width_ok: true}
        - {row_index: 12, cell_index: 1, col_start: 2, col_end: 2, text: $, span_rule: none, row_width_ok: true}
        - {row_index: 12, cell_index: 2, col_start: 3, col_end: 3, text: "5", span_rule: none, row_width_ok: true}
        - {row_index: 12, cell_index: 3, col_start: 4, col_end: 5, text: "7", span_rule: none, row_width_ok: true}
        - {row_index: 13, cell_index: 0, col_start: 0, col_end: 1, text: T, span_rule: none, row_width_ok: true}
        - {row_index: 13, cell_index: 1, col_start: 2, col_end: 5, text: u, span_rule: none, row_width_ok: true}
        - {row_index: 14, cell_index: 0, col_start: 2, col_end: 5, text: v, span_rule: span_from_row_above, row_width_ok: true}
        - {row_index: 15, cell_index: 0, col_start: 0, col_end: 3, text: w, span_rule: deeper_span, row_width_ok: true}
