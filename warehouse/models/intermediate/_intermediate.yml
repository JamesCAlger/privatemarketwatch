    given:
      - input: ref('int_row_corrected')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, '1' as cik, date '2026-03-31' as report_date, rr as row_reason
          from (values ('k1', 'filed'), ('k2', 'filed'), ('k3', 'filed'), ('k4', 'filed'), ('k5', 'filed'),
                       ('p1', 'correction_supplies_fair_value')) t(ctx, rr)
      - input: ref('int_field_normalised')
        format: sql
        rows: |
          select 'A' as accession, ctx as context_id, field, '1' as cik, date '2026-03-31' as report_date, vf as value_filed,
                 v as value, cur as currency, null::double as fx_rate, null::date as value_date, null::varchar as rate_kind,
                 'as_filed' as action, 'gd' as rule_id, st as status, rs as reason
