      n3 PIK above the rate: both unresolved (pik_above_rate). rate_is_cash_leg: n4 cash 6.25 plus PIK 3.125 = 9.375;
      n5 no PIK: the all-in rate is not set (cash_leg_without_pik), kind cash. Both tags: n6 add up with the PIK rate
      (all-in 12.5, cash 6.25); n7 do not (legs_do_not_add). n8 a cash-pay tag only under rate_is_all_in is the cash
