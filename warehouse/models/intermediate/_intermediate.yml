  - name: int_field_rule_par_tagged_as_units
    description: >
      Slice 3 Task 3. Invented rows: every par_tagged_as_units row mode, each with a row it must NOT touch. Fund 3
      rows_near_cost: n1 (debt row, count equal to cost) takes it at scale 1, principal and shares both; n3 at scale 1000
      (count 5, cost 5,000); n2 is NOT touched (label names units); n5 is NOT touched (no debt term fact). Fund 4 lists
      filing W (whole_filing) and also has rows_near_cost and listed_rows_without_instrument: w4 matches both
      whole_filing and rows_near_cost, and whole_filing wins (it names the filing); w2 (no debt term, no equity word)
      takes listed_rows_without_instrument; w3 (label names an LP interest) is NOT touched. Fund 6
      rated_rows_near_cost: r2 (spread) takes it, r1 (maturity only) is NOT touched. Fund 7 rows_within_twice_cost: v1
      (count 0.6 of cost) takes it, v2 (0.4 of cost) is NOT touched.
    model: int_field_rule
    given:
      - input: ref('int_field_read')
        format: sql
        rows: |
          select acc as accession, ctx as context_id, field, cik, date '2026-03-31' as report_date,
                 case when value_filed is null then 'absent' else 'read' end as status,
                 case when value_filed is null then 'no_fact' else 'one_fact' end as reason,
                 value_filed, case when value_filed is null then null when field = 'shares' then 'shares' else 'iso4217:USD' end as unit,
                 false as is_nil, null as fact_id
          from (values
            ('C', 'n1', '3', 1000.0, 1000.0), ('C', 'n2', '3', 1000.0, 1000.0), ('C', 'n3', '3', 5.0, 5000.0),
            ('C', 'n5', '3', 1000.0, 1000.0), ('W', 'w4', '4', 1000.0, 1000.0), ('W', 'w2', '4', 50.0, 999999.0),
            ('W', 'w3', '4', 50.0, 999999.0), ('R', 'r1', '6', 1000.0, 1000.0), ('R', 'r2', '6', 1000.0, 1000.0),
            ('V', 'v1', '7', 600.0, 1000.0), ('V', 'v2', '7', 400.0, 1000.0)
          ) t(acc, ctx, cik, sh, co)
          cross join lateral (values ('principal_amount', null::double), ('shares', sh), ('cost', co)) f(field, value_filed)
