      needs_correction fires only where the correction's field is what this side lacks: f1 (a fair-value correction,
      rule 3 no fair-value fact) and t1 (a principal correction, unresolved for want of a term fact) get it; w1 (a
      principal correction on a row that lacks a fair value) and w2 (a fair-value correction on a row that lacks a term
      fact) do not, and fall through to not_yet_explained and owner_review. needs_store_not_loaded: a1 (production
