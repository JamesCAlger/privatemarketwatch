  - name: cmp_rate_cause_rules
    description: >
      Slice 4 Task 4. Invented rows, fund 1, filing A at 2026-03-31; six field rows per context. r1 a rate equal within
      var cmp_rate_tolerance (9.63 against 9.630000000000001) and equal maturity dates; r2 a rate 0.01 apart and a
      maturity a month apart, production's source the tag -> NOT caused (not_yet_explained). r3 a loaded rate
      correction production names -> needs_correction on the rate, its cash leg and kind; the spread on the same row
      -> NOT (a rate correction does not cover the spread). r4 production names pik_rate corrected, nothing loaded ->
      needs_store_not_loaded production_corrected_no_loaded_store. r5 scale_not_decided here -> owner_review. r6 the
      rate from identifier text -> identifier_text_not_read. r7 a maturity read from the printed row ->
      printed_maturity_not_read. r10 rule_conflict -> not_yet_explained, detail rule_conflict. r11 text_not_read ->
      printed_total_margin_not_read (a spread read here). PIK-only rows (controller ruling 2026-11-23, text_not_read,
      no spread read here): r12 production read a coupon -> printed_rate_type_and_loan_class_not_read on rate and
      kind; r13 production read a margin -> the same on the spread; r14 production also left it empty -> no cause. r15
      production's whole-coupon transform -> whole_coupon_pik_not_read on the PIK rate, NOT on the spread. r16 the
      spread moved to the rate by the printed reference-rate column -> printed_reference_rate_column_not_read. r17
      production filled the rate from another context -> rate_only_context_not_adopted. r18 values_differ here ->
      owner_review two_values_filed_production_keeps_first. r3's cash leg is now cash_equals_all_in (owner ruling A,
      2026-11-23), equal to production's 5.38. r19 cash = all-in with no PIK read here, production's cash leg empty ->
      convention cash_equals_all_in_owner_ruling; r20 a cash leg from a read PIK rate with production's cash empty -> NOT
      caused (the cause needs reason cash_equals_all_in). r21 (controller ruling R1) cash leg unresolved pik_printed_not_tagged, production a cash leg through a loaded PIK correction -> printed_pik_not_read, not needs_correction. x1 sits in an excluded quarter and x2 is new only: no rows.
      Slice 5 Task 5 (this layer's side is int_field_corrected): r3's rate correction is applied here, so rate, cash leg
      and kind equal production's (was needs_correction); its spread still differs (a rate correction does not cover
      the spread). r22 a covering correction loaded and rejected here -> needs_correction correction_rejected_<reason>
      on rate and kind. r23 a PIK correction applied leaves the spread text_not_read while the value before equals
      production's -> owner_review pik_correction_leaves_spread_unread; r24 the same without the PIK correction -> NOT
      (printed_total_margin_not_read). r25 a spread correction applied, production holds another value, no rule ->
      not_yet_explained correction_applied_value_differs. r26 production filled the rate, this row is no taker, and a
      context with the same label carries a rate fact and no fair value -> same_identifier_context_fill_not_built; r17
      (no such sibling) stays rate_only_context_not_adopted. r27 a taker this layer paired (int_rate_adjacent) whose
      rate is text_not_read -> NOT rate_only_context_not_adopted (printed_rate_type_and_loan_class_not_read).
