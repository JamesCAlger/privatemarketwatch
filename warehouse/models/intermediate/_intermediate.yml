  - name: cmp_rate
    description: >
      Slice 4 Task 4. This layer's rate fields against production's on the position rows both sides have
      (cmp_row_set side both, both bases, the excluded quarters left out), joined on accession and context id. One row
      per (accession, context_id, field) for six fields: the all-in rate, the cash leg, the PIK rate, the spread (to
      basis_spread), the maturity date (date_new / date_production) and the rate kind (text_new / text_production,
      to interest_rate_kind). Production's interest_rate_reported is kept on the interest_rate row as
      value_production_reported, not compared. Outcome equal / differs / new_empty / production_empty / both_empty
      under var cmp_rate_tolerance; every other outcome has a cause from the closed list with a detail. Key and cause
      are tested in tests/cmp_rate_key_and_cause.sql. A rate-field rule_conflict (0 rows since the ruling of 2026-11-23)
      has no known cause and is not_yet_explained, detail rule_conflict. Agreement shows the two agree, not that either
      is right.
