  - name: int_rate_tag_cell_prints_pik
    description: >
      Controller ruling R1 (2026-11-23). The rate tag's own printed cell prints a PIK when 'pik' stands as a word of its
      own. Trips: t1 "6.00% PIK", t2 "11.62% (4.50% PIK)", t3 a hidden fact shown in "12.74% (incl. 0.50% PIK)". Must
      NOT trip: t4 "9.48%", t5 "Pikes Peak 7.00%" (letters follow), t6 "SPIKE 8.00%" (letters before), t7 a PIK printed
      only in the next cell of the row, t8 a fact with no placement (cell null). t9 a nil tag: no row.
    model: int_rate_tag_cell
    given:
      - input: ref('int_field_read')
        format: sql
        rows: |
          select acc as accession, ctx as context_id, 'interest_rate_tag' as field, 'read' as status, is_nil,
                 value_filed, fact_id
          from (values
            ('A', 't1', false, 0.06, 'f1'), ('A', 't2', false, 0.1162, 'f2'), ('A', 't3', false, 0.1274, 'f3'),
            ('A', 't4', false, 0.0948, 'f4'), ('A', 't5', false, 0.07, 'f5'), ('A', 't6', false, 0.08, 'f6'),
            ('A', 't7', false, 0.09, 'f7'), ('A', 't8', false, 0.09, 'f8'), ('A', 't9', true, null::double, 'f9')
          ) t(acc, ctx, is_nil, value_filed, fact_id)
      - input: ref('stg_filed_fact_placement')
        format: sql
        rows: |
          select acc as accession, fid as fact_id, ri as row_index, ci as cell_index, sri as shown_row_index,
                 sci as shown_cell_index
          from (values
            ('A', 'f1', 1, 0, null::integer, null::integer), ('A', 'f2', 2, 0, null, null),
            ('A', 'f3', null, null, 3, 1), ('A', 'f4', 4, 0, null, null), ('A', 'f5', 5, 0, null, null),
            ('A', 'f6', 6, 0, null, null), ('A', 'f7', 7, 0, null, null)
          ) t(acc, fid, ri, ci, sri, sci)
      - input: ref('stg_filed_document_row')
        format: sql
        rows: |
          select acc as accession, ri as row_index, cells
          from (values
            ('A', 1, ['6.00% PIK', '']), ('A', 2, ['11.62% (4.50% PIK)', '']),
            ('A', 3, ['Loan', '12.74% (incl. 0.50% PIK)']), ('A', 4, ['9.48%', '']), ('A', 5, ['Pikes Peak 7.00%', '']),
            ('A', 6, ['SPIKE 8.00%', '']), ('A', 7, ['9.00%', 'PIK'])
          ) t(acc, ri, cells)
    expect:
      rows:
        - {context_id: t1, prints_pik: true}
        - {context_id: t2, prints_pik: true}
        - {context_id: t3, prints_pik: true}
        - {context_id: t4, prints_pik: false}
        - {context_id: t5, prints_pik: false}
        - {context_id: t6, prints_pik: false}
        - {context_id: t7, prints_pik: false}
        - {context_id: t8, prints_pik: false}

  - name: int_rate_legs_check_fails_a_row_that_does_not_add
    description: >
      Slice 4 Task 3. The legs check lists x1 (all-in 10, cash 7, PIK 2: 7 + 2 is not 10), a hand-made row that must
      fail tests/int_field_normalised_rate_legs.sql. x2 adds up; x3 has no normalised cash leg, so the check does not
      apply.
    model: int_rate_legs_check
    given:
      - input: ref('int_field_normalised')
        format: sql
        rows: |
          select acc as accession, ctx as context_id, field, '1' as cik, date '2026-03-31' as report_date, value, status
          from (values
            ('A', 'x1', 'interest_rate', 10.0, 'normalised'),
            ('A', 'x1', 'interest_rate_cash', 7.0, 'normalised'),
            ('A', 'x1', 'pik_rate', 2.0, 'normalised'),
            ('A', 'x2', 'interest_rate', 10.0, 'normalised'),
            ('A', 'x2', 'interest_rate_cash', 7.0, 'normalised'),
            ('A', 'x2', 'pik_rate', 3.0, 'normalised'),
            ('A', 'x3', 'interest_rate', 10.0, 'normalised'),
            ('A', 'x3', 'interest_rate_cash', null, 'absent'),
            ('A', 'x3', 'pik_rate', 3.0, 'normalised')
          ) t(acc, ctx, field, value, status)
    expect:
      rows:
        - {context_id: x1, all_in: 10.0, cash: 7.0, pik: 2.0, difference: -1.0}
