version: 2

models:
  - name: stg_reading_rule
    description: One row per wrapper declaration entry (how a filer is read). Loaded as it stands; no rule is applied to data yet.
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
      - name: cik
        description: The filer. Null would mean a global rule; none is loaded yet.
      - name: action
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('reading_action')
                field: action
      - name: target
        data_tests: [not_null]
      - name: rule_class
        data_tests:
          - accepted_values:
              arguments:
                values: [convention, vocabulary, source, scope, value_test, filing_scoped, fund_rule]
      - name: validity_basis
        data_tests:
          - accepted_values:
              arguments:
                values: [stated, assumed_all_quarters]
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [10, 20, 30]
                quote: false
  - name: stg_correction
    description: One row per row-level fix, from the wrappers' row-level entries and the two row-correction files. Loaded as it stands; nothing is applied yet.
    columns:
      - name: correction_id
        data_tests: [unique, not_null]
      - name: cik
        data_tests: [not_null]
      - name: accession
        data_tests: [not_null]
      - name: field
        data_tests: [not_null]
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [value, relabel, exception, evidence]
  - name: stg_reading_not_loaded
    description: Wrapper declarations that need a procedure and are not loaded as rules.
  - name: stg_readings_manifest
    description: Row counts the loader recorded, for the count test.
  - name: stg_wrapper_drift
    description: >
      One row per fund in scope, with the wrapper files hashed when the view is read (build or test time). (a) The
      production wrapper (var production_wrappers_dir) against its SHA-256 when the new pipeline's copy was taken
      (wrappers/_source.json): changed. A change on the production side must be carried into the copy by hand until
      cutover (tests/baseline_production_wrapper_changed.sql). (b) The wrapper copy (var wrappers_dir) against the
      SHA-256 the readings loader recorded in its manifest: copy_changed, the loaded rules are stale
      (tests/baseline_wrapper_copy_changed_since_load.sql).
    columns:
      - name: cik
        data_tests: [unique, not_null]
      - name: copied_sha256
        data_tests: [not_null]
      - name: changed
        data_tests: [not_null]
      - name: copy_changed
        data_tests: [not_null]

  - name: stg_row_store_drift
    description: >
      One row per row-correction store the readings loader reads (var row_store_files), with the store file hashed
      when the view is read (build or test time), against the SHA-256 the loader recorded in its manifest. changed:
      the loaded corrections are stale, run load_readings.ps1 again (tests/baseline_row_store_changed_since_load.sql).
      The store is matched to its manifest entry by file name, because the loader records the path it was given.
    columns:
      - name: store
        data_tests: [unique, not_null]
      - name: current_sha256
        data_tests: [not_null]
      - name: changed
        data_tests: [not_null]
