name: warehouse
version: "0.1.0"
config-version: 2
profile: warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  partial_parse: false

vars:
  # Paths are relative to the warehouse/ folder (dbt.ps1 runs from there).
  output_dir: "../data/output"
  # Quarter used by the baseline tests that are measured at one date.
  baseline_date: "2026-03-31"
  # Largest difference between published and filed fair value that still counts as tied, in dollars.
  reconcile_tolerance: 500000
  # Files outside data/output that staging reads. Relative to the warehouse/ folder.
  thresholds_file: "../data/reference/quarter_acceptance_thresholds.json"
  cohort_manifest_file: "../data/overrides/wrapper_cohorts/v2_70_gate_verified_wrapper_manifest.json"
  # Folder of the filed-layer Parquet tables (one folder per filing). Relative to warehouse/.
  filed_dir: "data/filed"
  # Folder of the readings tables written by load_readings.ps1. Relative to warehouse/.
  readings_dir: "data/readings"
  # Wrapper drift (stg_wrapper_drift, final fix wave F1): the new pipeline's wrapper copies (with _source.json) and
  # production's wrappers, hashed at build time. Relative to warehouse/.
  wrappers_dir: "wrappers"
  production_wrappers_dir: "../data/overrides/bdc_xbrl_wrappers"
  # Row-correction store drift (stg_row_store_drift, slice 3 Task 1): the stores the readings loader reads, hashed at
  # build time against the loader's manifest. Same files as readings_loader/cli.py ROW_STORES. Relative to warehouse/.
  row_store_files:
    row_corrections: "../data/overrides/row_corrections.csv"
    row_corrections_by_context: "../data/overrides/row_corrections_by_context.csv"
  # Filing selection (int_filing_selected): a candidate filing is full when it has at least this percent of the
  # position facts of the fullest candidate for the same fund and date. A placeholder from the pilot: every
  # amendment seen so far was empty or at least 98 pct full (spec intermediate_spine.md 6.1).
  filing_fullness_min: 90
  # Row roles (int_role_scope), the detached_schedule filer rule: position contexts of one schedule are numbered
  # contiguously; a second schedule in the notes starts after a jump of at least this many context numbers. Ported
  # from pipeline/source_encodings.py DETACHED_MIN_CONTEXT_GAP (HPS: largest gap inside the main schedule 4, gap to
  # the JV schedule 1,353 to 2,761 across the parsed filings).
  detached_min_context_gap: 200
  # Baseline ceilings. Each baseline test warns while its count is above zero and FAILS the build if
  # the count rises above the ceiling. A count may fall freely. Raising a ceiling is a deliberate edit.
  baseline_max:
    one_sector_per_borrower: 132
    one_asset_category_per_position: 63
    one_lien_per_position: 116
    one_instrument_type_per_position: 6
    one_borrower_per_position: 210
    filing_single_form_type: 1
    published_equals_filed: 0
    fund_quarter_without_positions: 6
    filed_filing_missing: 0
    filed_context_missing: 0
    filed_fair_value_no_fact: 2009
    filed_fair_value_ambiguous: 0
    filed_fair_value_differs: 0
    filed_fair_value_differs_corrected: 2
    filed_fair_value_null: 0
    filed_position_fact_no_row: 896
    int_filing_refused: 2
    int_filing_accession_differs: 0
    int_filing_production_only: 0
    int_filing_new_only: 3
    # 603 (slice 2 Task 5): 743 less 140 Apollo rollups made subtotals by its fund rule subtotal_on_fair_value (D12).
    # 470 (slice 2 Task 6): 603 less the 133 rows production publishes, released by fund rules (D15).
    int_source_row_unresolved: 470
    # cmp_row_set one-sided rows, one ceiling per basis and cause (tests/generic/baseline_cmp_cause.sql), measured
    # 2026-11-19 after task 3 fix round 1 (docs/baseline_roles_2026-11-19.md). The two bases are never summed.
    # old_wrong: no rule and no row today; the ceiling keeps it at 0 until a rule is added.
    cmp_published_old_wrong: 0
    # new_wrong and owner_review: 0 since Task 6 (the 54 and the 45 + 34 were the 133 rows released by fund rules, D15).
    cmp_published_new_wrong: 0
    cmp_published_convention: 31
    cmp_published_needs_store_not_loaded: 12
    cmp_published_needs_correction: 52
    cmp_published_owner_review: 0
    # 2: BCRED Box Co-Invest (0001803498-25-000062 c-1259) and Blue Owl LSI Financing (0001812554-26-000027 c-1013;
    # detail relabel_loaded since Task 5: a relabel is on file in the wrapper copy, why production omits the row is not known).
    cmp_published_not_yet_explained: 2
    cmp_unpublished_old_wrong: 0
    cmp_unpublished_new_wrong: 0
    cmp_unpublished_convention: 30
    cmp_unpublished_needs_store_not_loaded: 0
    cmp_unpublished_needs_correction: 0
    cmp_unpublished_owner_review: 0
    cmp_unpublished_not_yet_explained: 0
    cmp_row_set_no_context: 0
    # Fund-quarters left out of the comparison (production has no rows): the three Q3-2026 filings (Ares, Blue Owl,
    # Apollo). Falls to 0 when production is built with them.
    cmp_excluded_quarter: 3
    # Review finding I2 (slice 2 Task 5): published positions whose fair value and term fact both come from fund
    # concept rules (Blue Owl commitment lines) with a positive fair value or a total-like label.
    concept_rule_value_and_term: 0
    # Owner decision 2026-11-19: production wrappers changed since the new pipeline's copy (warehouse/wrappers) was
    # taken. A change there must be carried into the copy by hand, then warehouse/wrappers/_source.json updated.
    production_wrapper_changed: 0
    # Final fix wave F1: a wrapper copy changed since the readings loader read it (the loaded rules are stale).
    wrapper_copy_changed_since_load: 0
    # Slice 3 Task 1, item b: a row-correction store changed since the readings loader read it (the loaded
    # corrections are stale). A rule, not a measurement.
    row_store_changed_since_load: 0
    # Slice 3 Task 1, item c: rows a fund rule position_without_term_fact made positions in a fund-quarter production
    # lacks (cmp_excluded_quarter). Measured 2026-11-22: 0.
    fund_rule_release_in_excluded_quarter: 0
    # Slice 2 Task 6 (D15): rows a fund rule position_without_term_fact made positions that production has no row for
    # on the same basis. The rules were written to release none; any such row fails the build.
    fund_rule_release_not_in_production: 0
    # Task 6 fix round 1: positions at rule 7 or 9 whose only term fact comes from a fund concept rule, with no
    # production row on the same basis in the compared quarters (macro concept_release_unmatched). Final fix wave F3:
    # the one measured row is pinned by key (concept_rule_release_pinned below), so the ceiling is 0.
    concept_rule_release_not_in_production: 0
  # The fund-quarters cmp_excluded_quarter may leave out, as cik|report_date|accessions. The count ceiling above does
  # not see a swap; tests/cmp_excluded_quarter_set.sql fails on any quarter not listed here. The list may shrink freely.
  # Concept-rule releases the guard tests/baseline_concept_rule_release_not_in_production.sql leaves out, as
  # accession|context_id (final fix wave F3). Blue Owl LSI Financing: the cmp not_yet_explained row (detail
  # relabel_loaded); its term fact comes from the fund's fees-concept rule; why production omits it is not known. A key
  # that no longer matches a release fails tests/concept_rule_release_pin_live.sql.
  concept_rule_release_pinned:
    - "0001812554-26-000027|c-1013"
  cmp_excluded_quarters_pinned:
    - "0001287750|2026-09-30|0001628280-26-067383"
    - "0001812554|2026-09-30|0001812554-26-000060"
    - "0001837532|2026-09-30|0001193125-26-449955"

models:
  warehouse:
    staging:
      +materialized: view
    marts:
      +materialized: table
    intermediate:
      +materialized: table

seeds:
  warehouse:
    +column_types:
      cik: varchar

data_tests:
  warehouse:
    # Keep the failing rows of every test in a table, so a failure can be inspected.
    +store_failures: true
