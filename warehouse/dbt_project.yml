name: warehouse
version: "0.1.0"
config-version: 2
profile: warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
  partial_parse: false

vars:
  # Paths are relative to the warehouse/ folder (dbt.ps1 runs from there).
  output_dir: "../data/output"
  # Quarter used by the baseline tests that are measured at one date.
  baseline_date: "2026-03-31"
  # Largest difference between published and filed fair value that still counts as tied, in dollars.
  reconcile_tolerance: 500000
  # Files outside data/output that staging reads. Relative to the warehouse/ folder.
  thresholds_file: "../data/reference/quarter_acceptance_thresholds.json"
  cohort_manifest_file: "../data/overrides/wrapper_cohorts/v2_70_gate_verified_wrapper_manifest.json"
  # Folder of the filed-layer Parquet tables (one folder per filing). Relative to warehouse/.
  filed_dir: "data/filed"
  # Folder of the readings tables written by load_readings.ps1. Relative to warehouse/.
  readings_dir: "data/readings"
  # Wrapper drift (stg_wrapper_drift, final fix wave F1): the new pipeline's wrapper copies (with _source.json) and
  # production's wrappers, hashed at build time. Relative to warehouse/.
  wrappers_dir: "wrappers"
  production_wrappers_dir: "../data/overrides/bdc_xbrl_wrappers"
  # Currency rates (stg_fx_rate, slice 3 Task 3): the FRED H.10 file production's principal conversion reads, US
  # dollars per unit of each currency, one row per date and currency. Relative to warehouse/.
  fx_rate_file: "../data/reference/monetary_conversion/fred_h10_usd_per_unit.csv"
  # A rate older than this many days before the report date is not used (scripts/programme_closeout/fx.py convert,
  # max_age_days=7: FX_stale).
  fx_max_age_days: 7
  # Slice 4 Task 3. The legs check (cash leg plus PIK equals all-in, spec section 7) and the comparison of two filed
  # rate tags, in percentage points. Float rounding only: the legs are fractions times 100 in double precision (error
  # near 1e-15); 1e-9 is far above that and far below the smallest printed rate step (0.01).
  rate_legs_tolerance: 1.0e-9
  # A PIK rate above the all-in rate tag by more than this (percentage points) contradicts rate_is_all_in: production's
  # own margin (pipeline/financial_conventions.py prepare: pik > reported_rate + 0.01).
  pik_above_rate_margin: 0.01
  # Row-correction store drift (stg_row_store_drift, slice 3 Task 1): the stores the readings loader reads, hashed at
  # build time against the loader's manifest. Same files as readings_loader/cli.py ROW_STORES. Relative to warehouse/.
  row_store_files:
    row_corrections: "../data/overrides/row_corrections.csv"
    row_corrections_by_context: "../data/overrides/row_corrections_by_context.csv"
  # Agent store drift (stg_agent_store_drift, slice 5 Task 2): the two agent stores the readings loader reads (loader
  # version 6), their scope funds' files hashed at build time against the loader's manifest. Same folders as
  # readings_loader/cli.py AGENT_STORES. Relative to warehouse/.
  agent_store_dirs:
    agent_b2_corrections: "../data/overrides/agent_b2_corrections"
    agent_investigate_rules: "../data/overrides/agent_investigate_rules"
  # Filing selection (int_filing_selected): a candidate filing is full when it has at least this percent of the
  # position facts of the fullest candidate for the same fund and date. A placeholder from the pilot: every
  # amendment seen so far was empty or at least 98 pct full (spec intermediate_spine.md 6.1).
  filing_fullness_min: 90
  # Row roles (int_role_scope), the detached_schedule filer rule: position contexts of one schedule are numbered
  # contiguously; a second schedule in the notes starts after a jump of at least this many context numbers. Ported
  # from pipeline/source_encodings.py DETACHED_MIN_CONTEXT_GAP (HPS: largest gap inside the main schedule 4, gap to
  # the JV schedule 1,353 to 2,761 across the parsed filings).
  detached_min_context_gap: 200
  # Comparison of amounts with production (cmp_amount, slice 3 Task 4). dollar: fair value, cost, principal and dollar
  # principal agree when they differ by less than this (D1, to the dollar). measured: shares and share of net assets
  # agree when they differ by no more than this; both are read from one tag, and the largest difference on agreeing
  # rows is float rounding of the times-100 (below 2e-15, scripts/slice3/q_t4_tolerance.sql).
  cmp_amount_tolerance:
    dollar: 1
    measured: 0.000001
  # Comparison of rates with production (cmp_rate, slice 4 Task 4): interest rate, cash leg, PIK rate and spread agree
  # when they differ by no more than this many percentage points. Both sides multiply one tagged fraction by 100; the
  # largest difference on agreeing rows is float rounding (3.6e-15); the smallest real difference measured is 0.12
  # (scripts/slice4/q_t4_tolerance.sql). Same value as rate_legs_tolerance.
  cmp_rate_tolerance: 1.0e-9
  # Baseline ceilings. Each baseline test warns while its count is above zero and FAILS the build if
  # the count rises above the ceiling. A count may fall freely. Raising a ceiling is a deliberate edit.
  baseline_max:
    one_sector_per_borrower: 132
    one_asset_category_per_position: 63
    one_lien_per_position: 116
    one_instrument_type_per_position: 6
    one_borrower_per_position: 210
    filing_single_form_type: 1
    published_equals_filed: 0
    fund_quarter_without_positions: 6
    filed_filing_missing: 0
    filed_context_missing: 0
    filed_fair_value_no_fact: 2009
    filed_fair_value_ambiguous: 0
    filed_fair_value_differs: 0
    filed_fair_value_differs_corrected: 2
    filed_fair_value_null: 0
    filed_position_fact_no_row: 896
    int_filing_refused: 2
    int_filing_accession_differs: 0
    int_filing_production_only: 0
    int_filing_new_only: 3
    # 603 (slice 2 Task 5): 743 less 140 Apollo rollups made subtotals by its fund rule subtotal_on_fair_value (D12).
    # 470 (slice 2 Task 6): 603 less the 133 rows production publishes, released by fund rules (D15).
    int_source_row_unresolved: 470
    # cmp_row_set one-sided rows, one ceiling per basis and cause (tests/generic/baseline_cmp_cause.sql), measured
    # 2026-11-19 after task 3 fix round 1 (docs/baseline_roles_2026-11-19.md). The two bases are never summed.
    # old_wrong: no rule and no row today; the ceiling keeps it at 0 until a rule is added.
    cmp_published_old_wrong: 0
    # new_wrong and owner_review: 0 since Task 6 (the 54 and the 45 + 34 were the 133 rows released by fund rules, D15).
    cmp_published_new_wrong: 0
    cmp_published_convention: 31
    cmp_published_needs_store_not_loaded: 12
    cmp_published_needs_correction: 52
    cmp_published_owner_review: 0
    # 2: BCRED Box Co-Invest (0001803498-25-000062 c-1259) and Blue Owl LSI Financing (0001812554-26-000027 c-1013;
    # detail relabel_loaded since Task 5: a relabel is on file in the wrapper copy, why production omits the row is not known).
    cmp_published_not_yet_explained: 2
    cmp_unpublished_old_wrong: 0
    cmp_unpublished_new_wrong: 0
    cmp_unpublished_convention: 30
    cmp_unpublished_needs_store_not_loaded: 0
    cmp_unpublished_needs_correction: 0
    cmp_unpublished_owner_review: 0
    cmp_unpublished_not_yet_explained: 0
    cmp_row_set_no_context: 0
    # Fund-quarters left out of the comparison (production has no rows): the three Q3-2026 filings (Ares, Blue Owl,
    # Apollo). Falls to 0 when production is built with them.
    cmp_excluded_quarter: 3
    # Review finding I2 (slice 2 Task 5): published positions whose fair value and term fact both come from fund
    # concept rules (Blue Owl commitment lines) with a positive fair value or a total-like label.
    concept_rule_value_and_term: 0
    # Owner decision 2026-11-19: production wrappers changed since the new pipeline's copy (warehouse/wrappers) was
    # taken. A change there must be carried into the copy by hand, then warehouse/wrappers/_source.json updated.
    production_wrapper_changed: 0
    # Final fix wave F1: a wrapper copy changed since the readings loader read it (the loaded rules are stale).
    wrapper_copy_changed_since_load: 0
    # Slice 3 Task 1, item b: a row-correction store changed since the readings loader read it (the loaded
    # corrections are stale). A rule, not a measurement.
    row_store_changed_since_load: 0
    # Slice 5 Task 2: a file of a scope fund in the two agent stores changed, appeared or went since the readings loader
    # read it (the loaded agent corrections and rules are stale). A rule, not a measurement.
    agent_store_changed_since_load: 0
    # Slice 3 Task 1, item c: rows a fund rule position_without_term_fact made positions in a fund-quarter production
    # lacks (cmp_excluded_quarter). Measured 2026-11-22: 0.
    fund_rule_release_in_excluded_quarter: 0
    # Slice 2 Task 6 (D15): rows a fund rule position_without_term_fact made positions that production has no row for
    # on the same basis. The rules were written to release none; any such row fails the build.
    fund_rule_release_not_in_production: 0
    # Task 6 fix round 1: positions at rule 7 or 9 whose only term fact comes from a fund concept rule, with no
    # production row on the same basis in the compared quarters (macro concept_release_unmatched). Final fix wave F3:
    # the one measured row is pinned by key (concept_rule_release_pinned below), so the ceiling is 0.
    concept_rule_release_not_in_production: 0
    # Slice 3 Task 2 (int_field_read): position rows whose amount field could not be decided, one ceiling per field,
    # measured 2026-11-22. All four are one fund's rows that tag one amount twice in two currencies with two numbers: cost
    # in EUR and in USD (3), principal in GBP and in EUR (1). Task 3's conversion rules may settle them.
    int_field_read_unresolved_fair_value: 0
    int_field_read_unresolved_cost: 3
    int_field_read_unresolved_principal_amount: 1
    int_field_read_unresolved_shares: 0
    int_field_read_unresolved_pct_of_net_assets: 0
    # Slice 4 Task 2 (int_field_read, rate fields and maturity date): unresolved per field, measured 2026-11-23. All six
    # unresolved rows are one fund's, in two filings (2025-03-31, 2025-06-30): the context carries the concept twice,
    # once in unit pure and once in utr:Rate, with two different numbers (values_differ). No cash-pay tag is filed on
    # any position of the five funds. Every maturity fact is an ISO date (not_a_date 0).
    int_field_read_unresolved_interest_rate_tag: 1
    int_field_read_unresolved_interest_rate_cash_tag: 0
    int_field_read_unresolved_pik_rate: 0
    int_field_read_unresolved_spread: 5
    int_field_read_unresolved_maturity_date: 0
    int_field_read_maturity_not_a_date: 0
    # Slice 3 Task 3 (int_field_normalised): unresolved amount fields per field and reason, measured 2026-11-22.
    # Share of net assets is no longer here: fraction_to_percent is built for it (fix round 1, was 30759 action_not_built).
    # 1: one principal tagged in two currencies with two numbers. 1: its principal_amount_usd.
    # 130: principal_amount_usd with no FRED H.10 quote within 7 days: 129 at 2026-09-30 (the rate file ends
    # 2026-09-11; production has no rows for that quarter) and 1 principal tagged KPW (no rate; looks mistyped, a
    # correction for slice 5). other: any unresolved (field, reason) pair not listed in normalised_unresolved_declared,
    # including feature_missing (a rule that needs a null row feature, spec section 5 rule 2): ceiling 0.
    int_field_normalised_unresolved_principal_amount_values_differ: 1
    int_field_normalised_unresolved_principal_amount_usd_principal_unresolved: 1
    # 1 (2026-11-23): the rate file was refreshed to 2026-11-13, so the 129 principals at 2026-09-30 convert; the one
    # left is an Apollo principal tagged KPW, a currency the file does not hold.
    int_field_normalised_unresolved_principal_amount_usd_no_fx_rate: 1
    int_field_normalised_unresolved_other: 0
    # Slice 4 Task 3 (rate fields), measured 2026-11-23 on all position rows of the five funds. scale_not_decided: a rate,
    # PIK rate or spread filed above 1 in a ratio unit (pure, utr:Rate), never rescaled by its size (controller ruling);
    # on interest_rate and its cash leg it also counts rows whose PIK rate is such a value. Owner ruling B (2026-11-23): a
    # fund scale rule per filing and field keeps such a value as a percent where the row's print agrees (int_rate_scale);
    # 17 rules. Left: interest_rate 6 and its cash leg 6 (was 679), pik_rate 0 (was 20), spread 0 (was 68). The 6 are
    # Apollo 0000950170-24-094137 rate tags printed as margins ('S+610'): no rule, the tag holds a spread, not a rate. pik_above_rate: a PIK rate above
    # the all-in tag plus 0.01 (production keeps these unresolved too). values_differ: the six Ares rows of Task 2 carried
    # through. text_not_read (controller ruling 2026-11-23, slice 4 Task 4, reverses the Task 3 PIK-only rulings): both
    # PIK-only actions need the printed rate type and the loan class (action_field.unread_input), so every PIK-only row is
    # text_not_read on interest_rate, its cash leg and spread: Ares 1,195, Apollo 62, Blue Owl 460, HPS 168 = 1,885 (the
    # 628 Blue Owl and HPS rows that tied as rule_conflict now resolve as text_not_read, which the order puts before a
    # conflict; rule_conflict 0; slice 5 Task 1 changed the order so that only a tie of rules that ALL need unread text
    # is text_not_read, a mixed tie is rule_conflict: these 628 tie two unread-text rules and stay). Before the ruling: rule_conflict 628 (Blue Owl 460, HPS 168; controller ruling,
    # waits for the text spec). spread text_not_read 2,425 = 540 + 1,885 (fix round 1, controller ruling; was feature_missing):
    # printed_margin_cash_plus_pik needs the printed total margin, text no model reads yet (action_field.unread_input):
    # Blue Owl 321, Apollo 219. feature_missing stays an error class: no declared pair, ceiling 0 under _other.
    int_field_normalised_unresolved_interest_rate_pik_above_rate: 15
    int_field_normalised_unresolved_interest_rate_scale_not_decided: 6
    int_field_normalised_unresolved_interest_rate_values_differ: 1
    int_field_normalised_unresolved_interest_rate_rule_conflict: 0
    # Slice 5 Task 4: +1 on each of the three text_not_read ceilings (1,886, 1,886, 2,426): Ares 0001287750-25-000038
    # c-1268 takes only a PIK rate from its neighbouring rate-only context (int_rate_adjacent), so it is a PIK-only row
    # like the others (production reads 10.25 all-in under its pik_only reading). Measured 2026-11-25.
    int_field_normalised_unresolved_interest_rate_text_not_read: 1886
    int_field_normalised_unresolved_interest_rate_cash_pik_above_rate: 15
    int_field_normalised_unresolved_interest_rate_cash_scale_not_decided: 6
    int_field_normalised_unresolved_interest_rate_cash_values_differ: 1
    int_field_normalised_unresolved_interest_rate_cash_rule_conflict: 0
    int_field_normalised_unresolved_interest_rate_cash_text_not_read: 1886
    # Controller ruling R1 (2026-11-23, fix round 1 of the rate rulings): cash legs left unresolved because the rate's
    # printed cell names a PIK that no tag carries (int_rate_tag_cell.prints_pik). Measured 2026-11-23: 69 (Ares 37,
    # BCRED 7, Apollo 3, HPS 22; 67 published, 2 unpublished).
    int_field_normalised_unresolved_interest_rate_cash_pik_printed_not_tagged: 69
    int_field_normalised_unresolved_pik_rate_scale_not_decided: 0
    int_field_normalised_unresolved_spread_scale_not_decided: 0
    int_field_normalised_unresolved_spread_values_differ: 5
    int_field_normalised_unresolved_spread_text_not_read: 2426
    int_field_normalised_unresolved_spread_rule_conflict: 0
    # Positions whose rate reading is a rule conflict (tests/baseline_int_field_rule_rate_conflict.sql): 0 since the ruling
    # of 2026-11-23 (was the 628 above, all
    # published). Rate bound 0 to 40 after conversion: 0 rows per field. Maturity before the report date: 6 Apollo rows,
    # one loan (maturity 2024-04-30) carried in six quarters 2024-06-30 to 2025-09-30.
    int_field_rule_rate_conflict: 0
    int_field_normalised_rate_bound_interest_rate: 0
    int_field_normalised_rate_bound_interest_rate_cash: 0
    int_field_normalised_rate_bound_pik_rate: 0
    int_field_normalised_rate_bound_spread: 0
    int_field_normalised_maturity_before_report_date: 6
    # The sum check (tests/baseline_int_field_normalised_sum_not_tied.sql), measured 2026-11-22 (fix round 1): fund-
    # quarters whose published normalised fair value misses the filed total investments on the step 1 basis
    # (fact_fund_period's A04 rule): Ares 3, BCRED 14 (it ties without cash rows, but its filed cash equivalents are
    # empty, so A04 keeps the published basis), Apollo 6; plus the three 2026-09-30 quarters with no filed total yet.
    # 25 (slice 3 Task 4 fix round 1): the split-bracket fix makes Apollo 2023-12-31 tie (ex cash 14.628m -> 0).
    # Final fix wave F5: the 25 are pinned by key in sum_not_tied_pinned below (tests/int_field_normalised_sum_not_tied_set.sql).
    # 11 (2026-11-23, owner decision D16): BCRED declares in its wrapper that the filed total leaves cash rows out
    # (fund rule filed_total_excludes_cash), so its 14 quarters tie on the ex-cash basis and leave the pinned list.
    int_field_normalised_sum_not_tied: 11
    # Final fix wave F3: tie-breaks (int_field_rule step 2) decided between rules of different effect. Measured 0 of 462
    # tie-broken rows per field (principal, shares). A rule, not a measurement.
    int_field_rule_tie_break_different_effect: 0
    # Slice 4 Task 1, item e: tie-breaks where every beaten rule is undecidable (tie_break_same_effect null), which the
    # test above cannot see. Measured 2026-11-23: 0. A rule, not a measurement.
    int_field_rule_tie_break_undecidable_loser: 0
    # Slice 4 Task 1 (owner decision 2026-11-23): commitment lines whose fair value repeats a line of the same borrower
    # in the same schedule (int_repeated_commitment_value). Measured 2026-11-23: 24, the 24 HPS joint venture schedule
    # lines of docs/baseline_amounts_2026-11-22.md (owner item 1); no other row of the five funds is flagged.
    int_repeated_commitment_value: 24
    # Final fix wave F4: position rows whose cost is read from a filer concept (fund rule concept_is_cost) and so
    # differs from int_context_feature.cost, which the subtotal rule reads. Measured 2026-11-22: 196. Any other
    # difference fails tests/int_field_read_cost_equals_feature.sql (ceiling 0).
    int_field_read_cost_filer_concept: 196
    # Slice 3 Task 4: cost pairs where production's cost differs from cost_reported (a donor proxy). Measured 0.
    cmp_amount_cost_columns_differ: 0
    # Slice 5 Task 3 (tests/baseline_int_correction_identifier_several.sql): identifier-keyed corrections whose text
    # matches several positions of the filing (each applies to all of them, as production). Measured 2026-11-24: 3.
    int_correction_identifier_several: 3
    # Slice 5 Task 4 (carried from the Task 3 review; tests/baseline_int_correction_identifier_production_context.sql):
    # identifier-keyed corrections matched natively whose production rows of the same filing and identifier name a
    # context other than the one matched here. Measured 2026-11-24: 2 (Blue Owl, both on fields not held, deferred).
    int_correction_identifier_production_context: 2
    # Slice 5 Task 4 (tests/baseline_int_rate_adjacent_pairs.sql): taker positions that take the rate facts of their
    # neighbouring rate-only context (int_rate_adjacent, owner decision 5). Measured 2026-11-24: 7, all Ares.
    int_rate_adjacent_pairs: 7
    # Slice 5 Task 3: the sum check on the corrected published basis (tests/baseline_int_field_corrected_sum_not_tied.sql,
    # macro sum_not_tied_rows corrected=true). Measured 2026-11-24: 3, the three 2026-09-30 quarters with no filed total yet.
    # The 8 fund-quarters that miss the filed total on the normalised basis (Ares 3, Apollo 5) all tie once the rows
    # corrections add are in (see sum_not_tied_corrected_pinned below).
    int_field_corrected_sum_not_tied: 3
  # Comparison of amounts with production (cmp_amount, slice 3 Task 4), one ceiling per basis, field and cause
  # (tests/generic/baseline_cmp_amount_cause.sql), measured 2026-11-22 (docs/baseline_amounts_2026-11-22.md). The two
  # bases are never summed. Every field carries every cause (shares and share of net assets since final fix wave F1).
  #   new_wrong 0 since fix round 1 (the 85 bracket rows and 196 filer-cost rows now equal production). principal
  #   owner_review 166 = 59 par_tagged_loan_test_stand_in + 107 unverified_unit_count_read_as_principal (was convention
  #   until final fix wave F7); unpublished 15 par_tagged. principal not_yet_explained 14: principal_empty_class_not_
  #   equity (BCRED STRUCTURED_CREDIT units, step not traced); dollar principal not_yet_explained 14: those 14 (was 16
  #   until slice 4 Task 1: the 2 correction_loaded_value_not_matched, F2, now have their own ceiling in
  #   cmp_amount_detail_max). JV old_wrong 2: principal_emptied_then_reclassified. currency convention 671:
  #   count_principal_currency_blank_in_production. shares needs_correction 219 (production names shares_held);
  #   shares owner_review 48 = 34 par_tagged + 14 units_tagged (unpublished 15 par_tagged). Share of net assets
  #   old_wrong 2 (unpublished): pct_size_bound_keeps_fraction.
  cmp_amount_max:
    published:
      fair_value: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 2, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
      cost: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 14, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
      principal_amount: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 5, needs_store_not_loaded: 0, production_stale: 0, owner_review: 166, not_yet_explained: 14}
      principal_amount_currency: {old_wrong: 0, new_wrong: 0, convention: 671, needs_correction: 282, needs_store_not_loaded: 0, production_stale: 0, owner_review: 59, not_yet_explained: 0}
      # not_yet_explained 14 (slice 4 Task 1, item d; was 16): principal_empty_class_not_equity only. The 2
      # correction_loaded_value_not_matched rows have their own ceiling in cmp_amount_detail_max below.
      principal_amount_usd: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 194, needs_store_not_loaded: 0, production_stale: 0, owner_review: 166, not_yet_explained: 14}
      shares: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 219, needs_store_not_loaded: 0, production_stale: 0, owner_review: 48, not_yet_explained: 0}
      pct_of_net_assets: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
    unpublished:
      fair_value: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
      cost: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
      principal_amount: {old_wrong: 2, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 15, not_yet_explained: 0}
      principal_amount_currency: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 15, not_yet_explained: 0}
      principal_amount_usd: {old_wrong: 2, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 15, not_yet_explained: 0}
      shares: {old_wrong: 0, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 15, not_yet_explained: 0}
      pct_of_net_assets: {old_wrong: 2, new_wrong: 0, convention: 0, needs_correction: 0, needs_store_not_loaded: 0, production_stale: 0, owner_review: 0, not_yet_explained: 0}
  # Cause details with a ceiling of their own (slice 4 Task 1, item d), per basis and field, keyed 'cause|detail'.
  # tests/generic/baseline_cmp_amount_cause.sql counts such a detail in its own test and leaves it out of its cause's
  # count above. correction_loaded_value_not_matched 2 (final fix wave F2): two Apollo dollar principals whose loaded
  # correction is a EUR / GBP principal; production converted it, this layer does not convert a correction.
  cmp_amount_detail_max:
    published:
      principal_amount_usd:
        "not_yet_explained|correction_loaded_value_not_matched": 2
  # Comparison of rates with production (cmp_rate, slice 4 Task 4), one ceiling per basis, field and cause
  # (tests/generic/baseline_cmp_rate_cause.sql), measured 2026-11-23 (docs/baseline_rates_2026-11-23.md). The two bases
  # are never summed. not_yet_explained 0 and new_wrong 0 everywhere (new_wrong was 3 before the controller ruling of
